<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F3BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AlfaMath">
<title>AlfaMath · שיעורי בית</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#15123B; --ink-2:#2B2760; --bg:#F5F4FF; --card:#fff; --soft:#F9F8FF;
    --line:#E6E3F5; --line-2:#D2CEEA; --muted:#6B6890; --faint:#A29FC0;
    --pri:#4F3BFF; --pri-2:#3A26E0; --pri-wash:#EFEDFF;
    --hot:#FF5C39; --hot-wash:#FFF0EC; --sun:#FFC83D; --sun-wash:#FFF7DB;
    --acc:#4F3BFF; --acc-wash:#EFEDFF;
    --ok:#0E9F6E; --ok-wash:#E9FAF3; --bad:#E5383B; --bad-wash:#FDEDEE; --warn:#C2410C; --warn-wash:#FFF0EC;
  }
  *{box-sizing:border-box;border-radius:0}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
  ::selection{background:var(--ink);color:#fff}
  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header .in{max-width:880px;margin:auto;padding:0 18px;height:60px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer;color:var(--ink)}
  .logo{width:36px;height:36px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;line-height:1;flex:none;position:relative;font-family:Georgia,"Times New Roman",serif;font-style:italic}
  .logo::after{content:"";position:absolute;top:-4px;left:-4px;width:11px;height:11px;background:var(--hot)}
  .brand b{font-weight:900;font-size:21px;letter-spacing:-.02em;line-height:1;direction:ltr;display:block;text-align:right}
  .brand b span{color:var(--pri)}
  .brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
  header .sp{flex:1}
  #hdr{display:flex;align-items:center;gap:6px;font-size:14px}
  main{max-width:880px;margin:auto;padding:24px 18px 120px}
  /* ---------- type ---------- */
  h1{font-size:30px;line-height:1.15;font-weight:900;letter-spacing:-.02em;margin:4px 0 6px}
  h2{font-size:19px;line-height:1.3;font-weight:800;margin:0}
  h3{font-size:16px;font-weight:800;margin:0}
  p{margin:0 0 10px}
  .muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
  .label{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}
  .ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
  .katex{direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:1.05em}
  .katex-display{direction:ltr}
  .prompt{white-space:pre-wrap}
  /* ---------- blocks ---------- */
  .card{background:var(--card);border:1px solid var(--line);margin:16px 0}
  .card > .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:relative}
  .card > .hd::before{content:"";position:absolute;inset-inline-start:0;top:16px;bottom:16px;width:4px;background:var(--pri)}
  .card > .hd h2{flex:1}
  .card > .bd{padding:18px 20px}
  .card.flat > .bd{padding:0}
  .hero{background:var(--pri);color:#fff;padding:24px 22px;margin:4px 0 16px;position:relative;overflow:hidden;isolation:isolate}
  .hero::before{content:"";position:absolute;z-index:-1;width:260px;height:260px;border:34px solid rgba(255,255,255,.08);transform:rotate(18deg);left:-70px;top:-90px}
  .hero::after{content:"";position:absolute;z-index:-1;width:64px;height:64px;background:var(--sun);transform:rotate(18deg);left:150px;bottom:-26px;box-shadow:-120px -40px 0 -18px var(--hot)}
  .hero h1{color:#fff;margin:0}
  .hero .muted{color:#D4CEFF}
  .hero .stats > div{border-color:rgba(255,255,255,.22)}
  .hero .stats .k{color:#D4CEFF}
  .stats{display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
  .stats > div{padding:2px 16px;border-inline-start:1px solid var(--line)}
  .stats > div:first-child{border-inline-start:none;padding-inline-start:0}
  .stats .v{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .stats .k{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
  /* ---------- controls ---------- */
  button,.btn{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--pri);background:transparent;color:var(--pri);padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;transition:background .15s,color .15s,transform .15s,box-shadow .15s,border-color .15s;white-space:nowrap}
  button:hover,.btn:hover{background:var(--pri);color:#fff}
  .primary{background:var(--pri);color:#fff}
  .primary:hover{background:var(--pri-2);border-color:var(--pri-2);transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(79,59,255,.7)}
  .light{border-color:var(--line-2);font-weight:700;color:var(--ink)}
  .light:hover{background:var(--pri-wash);color:var(--pri);border-color:var(--pri)}
  .ghost{border-color:transparent;background:transparent;color:var(--ink);padding:6px 10px;font-weight:700;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
  .ghost:hover{background:transparent;color:var(--acc);text-decoration-color:var(--acc)}
  .danger{color:var(--bad)} .ghost.danger:hover{color:var(--bad);text-decoration-color:var(--bad)}
  .btn-danger{border-color:var(--bad);color:var(--bad)} .btn-danger:hover{background:var(--bad);color:#fff}
  .wa{border-color:#16A34A;color:#15803D} .wa:hover{background:#16A34A;color:#fff}
  .big{font-size:17px;padding:14px 26px}
  .wide{width:100%}
  .sm{font-size:13.5px;padding:6px 12px;border-width:1.5px}
  button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
  button:disabled:hover{background:transparent;color:var(--pri)} .primary:disabled:hover{background:var(--pri);color:#fff}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  label.f{display:block;font-size:13px;font-weight:800;color:var(--ink);margin:16px 0 6px}
  label.f .muted{font-weight:500}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line-2);background:var(--soft);font:inherit;font-weight:500;color:var(--ink);transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:left 16px center,left 11px center;background-size:5px 5px;background-repeat:no-repeat;padding-left:32px}
  textarea{min-height:92px;resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:inset 0 -2px 0 var(--pri)}
  input::placeholder,textarea::placeholder{color:var(--faint);font-weight:400}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .chk{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:15px;cursor:pointer}
  .chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink);flex:none}
  .err{color:var(--bad);font-weight:700;margin:12px 0 0;font-size:14.5px}
  /* code boxes */
  .codebox{display:flex;gap:8px;justify-content:center;direction:ltr}
  .codebox input{width:48px;height:58px;padding:0;text-align:center;font-size:24px;font-weight:900;text-transform:uppercase;border:1.5px solid var(--line-2);background:#fff;caret-color:var(--acc)}
  #p1 input,#p2 input,.pin input{-webkit-text-security:disc;text-security:disc}
  .codebox input.on{border-color:var(--pri);color:var(--pri)}
  .codebox input:focus{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border:1px solid var(--line-2);color:var(--ink-2);background:#fff;white-space:nowrap}
  .chip.ink{background:var(--pri);border-color:var(--pri);color:#fff}
  .chip.hot{background:var(--hot);border-color:var(--hot);color:#fff}
  .chip.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}
  .chip.ok{border-color:#BBF7D0;color:var(--ok);background:var(--ok-wash)}
  .chip.bad{border-color:#FECACA;color:var(--bad);background:var(--bad-wash)}
  .chip.warn{border-color:#FDE68A;color:var(--warn);background:var(--warn-wash)}
  .chip.acc{border-color:#C7D2FE;color:var(--acc);background:var(--acc-wash)}
  /* tabs */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line-2);margin:18px 0 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:none;background:none;padding:12px 16px;color:var(--muted);font-weight:800;position:relative;font-size:15px}
  .tabs button:hover{background:none;color:var(--ink)}
  .tabs button.on{color:var(--ink)}
  .tabs button.on{color:var(--pri)}
  .tabs button.on::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:3px;background:var(--pri)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--pri);margin-bottom:6px}
  .seg button{border:none;padding:11px;font-weight:800;color:var(--ink)}
  .seg button.on{background:var(--pri);color:#fff}
  .seg button:not(.on):hover{background:var(--soft);color:var(--ink)}
  /* lists */
  .rows > .r{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
  .rows > .r:first-child{border-top:none}
  .rows > .r:hover{background:var(--soft)}
  .rows > .r.off{cursor:default} .rows > .r.off:hover{background:none}
  .r .t{font-weight:800;line-height:1.35}
  .r .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
  .r .end{display:flex;align-items:center;gap:10px;flex:none}
  .date{width:46px;height:50px;border:2px solid var(--pri);color:var(--pri);background:var(--pri-wash);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
  .date b{font-size:19px;font-weight:900}
  .date span{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
  .date.none{border-color:var(--line-2);color:var(--faint);background:#fff}
  .date.late{border-color:var(--bad);color:var(--bad);background:var(--bad-wash)}
  .chev{width:16px;height:16px;color:var(--faint);flex:none}
  .gbadge{min-width:46px;height:38px;padding:0 8px;display:inline-grid;place-items:center;font-weight:900;font-size:18px;border:2px solid var(--pri);color:var(--pri);font-variant-numeric:tabular-nums}
  .gbadge.hi{background:var(--ok-wash)} .gbadge.lo{background:var(--bad-wash)}
  .gbadge.hi{border-color:var(--ok);color:var(--ok)} .gbadge.lo{border-color:var(--bad);color:var(--bad)}
  /* grade */
  .grade{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .grade .n{font-size:84px;font-weight:900;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--pri)}
  .grade .n.hi{color:var(--ok)} .grade .n.lo{color:var(--bad)}
  .cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:14px;max-width:340px}
  .cells i{height:10px;background:var(--line)}
  .cells i.f{background:var(--pri)}
  .cells.draw i.f{animation:cell .35s both}
  @keyframes cell{from{background:var(--line)}}
  @media (prefers-reduced-motion:reduce){.cells.draw i.f{animation:none}}
  /* questions */
  .q{padding:20px;border-top:1px solid var(--line);position:relative}
  .q:first-child{border-top:none}
  .qh{display:flex;gap:12px;align-items:flex-start}
  .qn{width:30px;height:30px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;margin-top:1px}
  .q.answered .qn{background:var(--ok)}
  .q .body{flex:1;min-width:0}
  .pts{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
  .fig{margin:14px 0 4px;text-align:center}
  .fig img{max-width:100%;height:auto;max-height:260px}
  .ans{display:flex;align-items:stretch;gap:0;margin-top:14px;max-width:460px}
  .ans input{font-size:19px;font-weight:700;padding:13px 14px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;background:#fff;border-color:var(--line-2)}
  .ans .unit{direction:ltr;display:grid;place-items:center;padding:0 14px;border:1px solid var(--line-2);border-inline-end:none;background:var(--soft);color:var(--ink-2);font-weight:700;white-space:nowrap}
  .keys{display:none;flex-wrap:wrap;gap:4px;margin-top:6px;direction:ltr;justify-content:flex-end;max-width:460px}
  .q.focus .keys{display:flex}
  .keys button{min-width:42px;padding:6px 8px;font-size:15px;border-width:1px;border-color:var(--line-2);font-weight:700;background:#fff}
  .keys button{color:var(--ink)}
  .keys button:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
  .choices{display:grid;gap:8px;margin-top:14px}
  .choice{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line-2);cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
  .choice:hover{border-color:var(--pri)}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice .let{width:26px;height:26px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:var(--muted)}
  .choice.sel{border-color:var(--pri);background:var(--pri-wash);box-shadow:inset -4px 0 0 var(--pri)}
  .choice.sel .let{background:var(--pri);border-color:var(--pri);color:#fff}
  .choice:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
  .choice.right{border-color:var(--ok);background:var(--ok-wash)}
  .hintbox{margin-top:12px;padding:10px 14px;border:1px dashed var(--line-2);background:var(--soft);font-size:15px}
  .mark{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding:10px 14px;font-size:15px;font-weight:600;border-inline-start:3px solid}
  .mark.ok{background:var(--ok-wash);border-color:var(--ok);color:#14532D}
  .mark.bad{background:var(--bad-wash);border-color:var(--bad);color:#7F1D1D}
  .mark b{font-weight:900}
  .yours{margin-top:10px;font-size:15px;color:var(--muted)}
  .yours b{color:var(--ink);font-weight:800}
  .sol{margin-top:10px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);font-size:15px}
  .sol .label{display:block;margin-bottom:4px}
  /* dock */
  .dock{position:fixed;inset-inline:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line-2);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
  .dock .in{max-width:880px;margin:auto;display:flex;align-items:center;gap:16px}
  .segbar{display:flex;gap:3px;margin-top:6px}
  .segbar i{flex:1;height:8px;background:var(--line)}
  .segbar i.f{background:var(--pri)}
  .timer{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;padding:4px 10px;border:2px solid var(--pri);color:var(--pri)}
  .timer.low{border-color:var(--bad);color:var(--bad)}
  /* student bottom nav */
  .bnav{position:fixed;inset-inline:0;bottom:0;z-index:24;background:#fff;border-top:1px solid var(--line-2);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{border:none;flex-direction:column;gap:2px;padding:10px 4px 9px;font-size:12.5px;color:var(--muted);font-weight:700;position:relative}
  .bnav button:hover{background:var(--soft);color:var(--ink)}
  .bnav button svg{width:22px;height:22px}
  .bnav button.on{color:var(--pri)}
  .bnav button.on::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;background:var(--pri)}
  .bnav .dot{position:absolute;top:6px;inset-inline-start:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
  /* tables */
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:start;white-space:nowrap}
  th{color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.06em;background:var(--pri-wash)}
  td.c,th.c{text-align:center}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
  .yes{color:var(--ok);font-weight:900} .no{color:var(--bad);font-weight:900}
  .meter{height:8px;background:var(--line);min-width:60px;position:relative}
  .meter i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--pri)}
  .meter.lo i{background:var(--bad)} .meter.hi i{background:var(--ok)}
  /* misc */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px;background:none;border:none;padding:2px 0;cursor:pointer;text-decoration:none}
  .back:hover{background:none;color:var(--pri)}
  .back svg{width:14px;height:14px}
  .note{background:var(--warn-wash);border:1px solid #FDE68A;border-inline-start:3px solid var(--warn);padding:12px 16px;margin:16px 0;font-size:15px}
  .info{background:var(--acc-wash);border:1px solid #C7D2FE;border-inline-start:3px solid var(--acc);padding:12px 16px;margin:16px 0;font-size:15px}
  .bigcode{font-size:40px;font-weight:900;letter-spacing:.18em;direction:ltr;display:inline-block;line-height:1;color:var(--pri)}
  .empty{text-align:center;padding:30px 16px;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:17px;font-weight:800;margin-bottom:4px}
  .toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;z-index:60;font-size:15px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
  .qedit{border:1px solid var(--line-2);background:#fff;margin:14px 0}
  .qedit .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--pri-wash);border-bottom:1px solid var(--line)}
  .qedit .inner{padding:4px 16px 16px}
  .preview{border:1px dashed var(--line-2);padding:4px 0;margin-top:8px;background:#fff}
  details{margin-top:12px;border:1px solid var(--line)}
  details summary{cursor:pointer;font-size:13.5px;font-weight:800;padding:9px 12px;background:var(--soft);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"+";display:inline-block;width:18px;font-weight:900}
  details[open] summary::before{content:"−"}
  details > div{padding:4px 12px 12px}
  dialog{border:none;border-top:6px solid var(--pri);padding:24px;max-width:min(460px,calc(100vw - 28px));width:100%;color:var(--ink);box-shadow:0 30px 80px -20px rgba(12,10,9,.5)}
  dialog.wide{max-width:min(720px,calc(100vw - 20px))}
  dialog::backdrop{background:rgba(12,10,9,.45)}
  .auth{max-width:440px;margin:24px auto}
  .bars .b{display:flex;align-items:center;gap:12px;margin:10px 0}
  .bars .b .name{width:120px;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars .b .meter{flex:1;height:10px}
  .bars .b .v{width:44px;text-align:end;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

function stuStats(d){
  const graded = d.assignments.filter(a => a.mode!=="practice" && a.last && a.last.score != null);
  const wsum = graded.reduce((s,a)=>s+(+a.weight||1),0);
  const avg = graded.length ? Math.round(graded.reduce((s,a)=>s+pct(a.last.score,a.last.max)*(+a.weight||1),0)/wsum) : null;
  const hist = graded.slice().sort((x,y)=>new Date(x.last.at)-new Date(y.last.at)).map(a=>pct(a.last.score,a.last.max));
  const dueOnes = d.assignments.filter(a => a.mode!=="practice" && a.due_at).sort((x,y)=>new Date(x.due_at)-new Date(y.due_at));
  let streak = 0; for(let i=dueOnes.length-1;i>=0;i--){ const a = dueOnes[i]; if(!isPast(a.due_at) && !a.attempts) continue; if(a.attempts && new Date(a.last.at) <= new Date(a.due_at)) streak++; else break; }
  const onTime = dueOnes.filter(a=>a.attempts && new Date(a.last.at) <= new Date(a.due_at)).length;
  return { graded, avg, hist, streak, onTime, submitted: d.assignments.filter(a=>a.attempts).length };
}

  return { g, ics: URL.createObjectURL(new Blob([ics],{type:"text/calendar"})) };
}

    <div class="card flat"><div class="bd" id="qs">

      <button class="primary big" id="sub">הגשה</button>
    </div></div>`;

    const ans = collect(body); let n = 0;

    $("#pc").textContent = n;
    $$("#qs .q").forEach(el => el.classList.toggle("answered", !!ans[el.dataset.id]));
    return { ans, n };
  };
  refresh();
  let saveT;
  const save = () => { store(dkey, collect(body)); refresh(); clearTimeout(saveT); $("#saved").textContent = "טיוטה נשמרה"; saveT = setTimeout(()=>{ const s=$("#saved"); if(s) s.textContent=""; }, 1500); };
  body.addEventListener("input", save); body.addEventListener("change", save);
  $$(".hint", body).forEach(b => b.onclick = async () => {
    const qel = b.closest(".q"), q = a.questions.find(x=>x.id===qel.dataset.id);
    if(+q.hint_penalty && !(await ask(`<h2>לפתוח רמז?</h2><p class="muted">אם תענה נכון, השאלה תהיה שווה ${Math.max(0,q.points-q.hint_penalty)} נק׳ במקום ${q.points}.</p>`, "פתיחת רמז", "בלי רמז"))) return;

  });

    if(sending) return; sending = true;
    $("#sub").disabled = true; $("#sub").textContent = "שולח…";
    const { ans } = refresh();
    let r; try{ r = await rpcS("hw_student_submit", { p_id:a.id, p_answers:ans }); }
    catch(e){ sending = false; $("#sub").disabled=false; $("#sub").textContent="הגשה"; $("#out").innerHTML=`<p class="err">${esc(errMsg(e))}</p>`; return; }
    clearInterval(timerInt); store(dkey, null); HOME = null;
    a.attempts = r.attempt; a.started_at = null;
    if(auto) toast("הזמן נגמר. התשובות נשלחו");
    showReview(body, a, { score:r.score, max:r.max, results:r.results, answers:ans, at:new Date().toISOString() }, true);
  };

    const missing = a.questions.length - n;

      const firstEmpty = a.questions.findIndex(q => !ans[q.id]);

        const el = $$("#qs .q")[firstEmpty]; el.scrollIntoView({behavior:"smooth",block:"center"}); const inp = el.querySelector("input.ansin"); inp && setTimeout(()=>inp.focus({preventScroll:true}),350); return; }
    } else if(final && !(await ask(`<h2>להגיש?</h2><p class="muted">ענית על כל השאלות. אחרי ההגשה אי אפשר לשנות.</p>`, "הגשה", "עוד רגע"))) return;
    send(false);
  };
  if(a.time_limit_min && a.started_at){

      if(left <= 0){ clearInterval(timerInt); send(true); } };
    tick(); timerInt = setInterval(tick, 1000);
  }
}
function showReview(body, a, last, fresh){

    <div class="card"><div class="bd">
      ${graded ? `<div class="grade"><div><div class="label">${fresh?"הוגש. הציון שלך":"הציון שלך"}</div><div class="n ${band(p)}">${p}</div></div>

    <div class="card flat"><div class="bd">
      ${a.questions.map((q,i)=>{ const x = res[q.id] || {}; const given = (last.answers||{})[q.id] ?? x.given ?? "";

        const sol = q.solution && x.correct !== undefined ? `<div class="sol"><span class="label">פתרון</span><div class="prompt">${esc(q.solution)}</div></div>` : "";
        return `<div class="q"><div class="qh"><span class="qn" style="${x.correct===true?"background:var(--ok)":x.correct===false?"background:var(--bad)":""}">${i+1}</span><div class="body"><div class="prompt">${esc(q.prompt)}</div>${figHtml(q.figure)}
          <div class="yours">התשובה שלך: <b><bdi class="${q.kind==="choice"?"":"ltr"}">${given===""?"לא נענתה":esc(shown)}</bdi></b>${q.unit&&given!==""&&q.kind==="number"?` <bdi class="ltr">${esc(q.unit)}</bdi>`:""}</div>${fb}${sol}</div></div></div>`; }).join("")}
    </div></div>
    ${fresh ? `<button class="wide big light" onclick="go('#/')">חזרה למשימות</button>` : ""}`;

async function loadAll(){
  const [c, s, a, sub, q, rp] = await Promise.all([
    sb.from("hw_classes").select("id,name,join_code,join_open,created_at").order("created_at"),
    sb.from("hw_students").select("id,class_id,display_name,username,created_at,teacher_note,email,claimed_at").order("display_name"),
    sb.from("hw_assignments").select("id,title,is_open,opens_at,due_at,created_at,mode,weight,time_limit_min,show_results,hw_assignment_classes(class_id)").order("created_at",{ascending:false}),
    sb.from("hw_submissions").select("id,assignment_id,student_id,score,max_score,manual_score,created_at").order("created_at"),
    sb.from("hw_questions").select("id,assignment_id,topic"),
    sb.from("hw_claim_reports").select("id,student_id,note,created_at").eq("resolved", false).order("created_at")
  ]);
  const err = c.error || s.error || a.error || sub.error || q.error; if(err) throw err;
  const D = { classes:c.data, students:s.data, assignments:a.data, subs:sub.data, questions:q.data, reports:rp.data||[] };
  D.last = {}; D.subs.forEach(x => { if(x.student_id) D.last[x.student_id+"|"+x.assignment_id] = x; });
  D.eff = x => pct(x.manual_score ?? x.score, x.max_score);
  D.asgFor = cid => D.assignments.filter(a => a.hw_assignment_classes.some(x=>x.class_id===cid));
  D.studentsOf = cid => D.students.filter(s => s.class_id===cid);
  D.studentAvg = st => { const as = D.asgFor(st.class_id).filter(a=>a.mode!=="practice"); let w=0, s=0; as.forEach(a=>{ const x = D.last[st.id+"|"+a.id]; if(x){ w += +a.weight||1; s += D.eff(x)*(+a.weight||1); } }); return w ? Math.round(s/w) : null; };
  D.studentHist = st => D.asgFor(st.class_id).filter(a=>a.mode!=="practice").map(a=>D.last[st.id+"|"+a.id]).filter(Boolean).sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)).map(D.eff);
  D.missed = st => D.asgFor(st.class_id).filter(a=>a.mode!=="practice" && a.due_at && isPast(a.due_at) && !D.last[st.id+"|"+a.id]);
  D.risk = st => { const h = D.studentHist(st), avg = D.studentAvg(st), miss = D.missed(st).length, why = [];
    if(miss >= 2) why.push(`לא הגיש ${miss} משימות`); if(avg != null && avg < 60) why.push(`ממוצע ${avg}`);
    if(h.length >= 2 && h[h.length-2] - h[h.length-1] >= 15) why.push(`ירידה של ${h[h.length-2]-h[h.length-1]} נקודות`); return why; };
  return D;
}

/* submission detail: answers, manual score, note */
async function openSubmission(subId, after){
  const { data:s, error } = await sb.from("hw_submissions").select("*").eq("id", subId).single();
  if(error) return toast(error.message);
  const { data:qs } = await sb.from("hw_questions").select("id,position,prompt,kind,choices,points").eq("assignment_id", s.assignment_id).order("position");
  const res = Object.fromEntries((s.results||[]).map(r=>[r.question_id, r]));
  const d = sheet(`<h2>${esc(s.student_name)}</h2><p class="muted small">הוגש ${fmtDate(s.created_at)}. ציון אוטומטי: ${pct(s.score,s.max_score)} (${+(+s.score).toFixed(2)} מתוך ${s.max_score} נק׳)</p>
    <div style="max-height:44vh;overflow:auto;border:1px solid var(--line);margin-top:10px">${(qs||[]).map((q,i)=>{ const r = res[q.id]||{}; const g = q.kind==="choice" && r.given!=null ? (q.choices||[])[+r.given] ?? r.given : r.given;
      return `<div style="padding:12px 14px;border-bottom:1px solid var(--line)"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><b class="${r.correct?"yes":"no"}" style="width:22px">${r.correct?"✓":"✗"}</b><div class="grow"><div class="small prompt">${i+1}. ${esc(q.prompt)}</div>
        <div class="tiny" style="margin-top:4px">ענה: <b><bdi>${esc(g??"—")}</bdi></b>${!r.correct&&r.answer?` · נכון: <bdi>${esc(r.answer)}</bdi>`:""}${r.hint?" · נעזר ברמז":""}</div></div></div></div>`; }).join("")}</div>
    <div class="row" style="margin-top:14px;align-items:flex-end"><div style="width:140px"><label class="f">ציון ידני (0–100)</label><input id="ms" type="number" min="0" max="100" value="${s.manual_score!=null?pct(s.manual_score,s.max_score):""}" placeholder="${pct(s.score,s.max_score)}"></div><span class="muted tiny grow">ריק = הציון האוטומטי</span></div>
    <label class="f">הערה לתלמיד <span class="muted">(התלמיד יראה אותה)</span></label><textarea id="mn" style="min-height:70px">${esc(s.teacher_note||"")}</textarea>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="light" onclick="this.closest('dialog').close()">ביטול</button><button class="primary" id="msave">שמירה</button></div>`, true);
  $("#msave", d).onclick = async () => {
    const v = $("#ms", d).value.trim();
    const upd = { manual_score: v==="" ? null : Math.max(0,Math.min(100,+v)) * s.max_score / 100, teacher_note: $("#mn", d).value.trim() || null };
    const { error } = await sb.from("hw_submissions").update(upd).eq("id", subId);
    if(error) return toast(error.message);
    d.close(); toast("נשמר"); after && after();
  };
}

let A = null, Q = [], removed = [], dirty = false, CL = [], ACL = [];
async function teacherAssignment(idq){
  if(!(await requireTeacher())) return;

  app().innerHTML = `<p class="muted">טוען…</p>`;

    sb.from("hw_assignments").select("*").eq("id",id).single(),
    sb.from("hw_questions").select("*").eq("assignment_id",id).order("position"),
    sb.from("hw_classes").select("id,name").order("created_at"),
    sb.from("hw_assignment_classes").select("class_id").eq("assignment_id",id)
  ]);
  if(seq!==navSeq) return;
  if(error || !a){ app().innerHTML = `${backBtn("לוח ניהול","#/teacher?tab=a")}<div class="card"><div class="empty"><b>המשימה לא נמצאה</b></div></div>`; return; }
  A = a; Q = qq || []; removed = []; dirty = false; CL = cl || []; ACL = (acl||[]).map(x=>x.class_id);

    <h1 id="ttl">${esc(a.title)}</h1>
    <div class="row" id="hdrrow" style="margin-top:8px"></div>
    <div id="nocls"></div>
    <div class="tabs" role="tablist"><button data-t="results">תוצאות</button><button data-t="questions">שאלות</button><button data-t="preview">תצוגה</button><button data-t="settings">הגדרות</button></div>
    <div id="tab"></div>`;
  drawAssignHeader();
  const show = async t => {
    if(dirty && !["questions","preview"].includes(t) && !(await ask(`<h2>יש שינויים שלא נשמרו</h2><p class="muted">השינויים בשאלות יאבדו.</p>`, "לעבור בלי לשמור", "להישאר"))) return;
    if(!["questions","preview"].includes(t)) dirty = false;
    $$(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
    ({results:tabResults, questions:tabQuestions, preview:tabPreview, settings:tabSettings})[t]();
  };
  $$(".tabs button").forEach(b => b.onclick = () => show(b.dataset.t));
  show(tab);
}

function downloadCsv(name, rows){

/* questions editor */
const AI_PROMPT = `הפוך את דף התרגילים המצורף (או: כתוב __ שאלות בנושא ___ לכיתה ___) לשאלות עם תשובה סופית בלבד.
פתור כל שאלה בעצמך ובדוק את התשובה פעמיים.
כללים: רוב השאלות עם תשובה מספרית. אמריקאית רק לפעמים, לשאלות של הבנה. תשובה במילים כשהתשובה היא מושג.
החזר רק JSON תקין, בלי שום טקסט לפני או אחרי, בפורמט:
[
 {"prompt":"נוסח השאלה, נוסחאות בין סימני $ למשל $v=\\\\frac{d}{t}$", "kind":"number", "answer":{"value":12, "unit":"m/s"}, "topic":"קינמטיקה", "points":1, "hint":"רמז קצר (לא חובה)", "solution":"פתרון קצר (לא חובה)"},
 {"prompt":"...", "kind":"choice", "choices":["...","...","...","..."], "answer":{"index":1}, "topic":"..."},
 {"prompt":"...", "kind":"text", "answer":{"accepted":["שווה שוקיים","טרפז שווה שוקיים"]}, "topic":"..."}
]
kind: number לתשובה מספרית (value מספר בלבד, unit יחידות; לתשובה לא שלמה אפשר tol_pct), choice לאמריקאית (index מתחיל מ-0), text למילה או ביטוי (כל הצורות המקובלות ב-accepted).
שאלה מסוג "הסבר" או "הוכח" – הפוך לשאלה עם תשובה סופית או השמט.
אם לשאלה צריך שרטוט, הוסף "figure" עם קוד SVG פשוט (xmlns, viewBox ברוחב 320, קווים כהים, תוויות מספריות, "?" על הגודל המבוקש). אל תסגיר בשרטוט את התשובה.`;

  el.innerHTML = `

  $("#add").onclick = () => { Q.push({ id:uuid(), assignment_id:A.id, prompt:"", kind:"number", choices:null, answer:{value:""}, points:1, figure:null, topic:Q.length?Q[Q.length-1].topic:null, hint:null, hint_penalty:0, solution:null, params:null, _new:true }); draw(); markDirty(); $$(".qedit").pop().scrollIntoView({behavior:"smooth",block:"start"}); };
  $("#imp").onclick = () => { const b=$("#impbox"); b.style.display = b.style.display==="none"?"block":"none"; };
  $("#cpp").onclick = () => copy(AI_PROMPT, "ההנחיה הועתקה");
  $("#impgo").onclick = () => {
    try{
      let txt = $("#impt").value.trim(); const s = txt.indexOf("["), e2 = txt.lastIndexOf("]"); if(s >= 0 && e2 > s) txt = txt.slice(s, e2+1);

    else if(f==="solution") q.solution = v.trim() || null;
    else if(f==="points") q.points = parseFloat(v)||0;
    else if(f==="value") q.answer.value = v;
    else if(f==="tol_pct") q.answer.tol_pct = v==="" ? null : parseFloat(v);
    else if(f==="unit") q.answer.unit = v;
    else if(f==="formula"){ if(v.trim()) q.answer.formula = v.trim(); else delete q.answer.formula; }
    else if(f==="params"){ try{ q.params = parseParams(v); box.querySelector(".perr").textContent = ""; }catch(err){ box.querySelector(".perr").textContent = err.message; } }
    else if(f==="accepted") q.answer.accepted = v.split("\n").map(s=>s.trim()).filter(Boolean);
    else if(f==="choices") q.choices = v.split("\n").map(s=>s.trim()).filter(Boolean);

  $("#qlist").addEventListener("change", e => {

    if(f==="correct"){ q.answer.index = +e.target.value; renderPv(i); markDirty(); }
    if(f==="choices"){ if(q.answer.index >= (q.choices||[]).length) q.answer.index = 0; draw(); }
  });
  $("#qlist").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if(!b) return;

    if(act==="up" && i>0) [Q[i-1],Q[i]]=[Q[i],Q[i-1]];

      if(rows.length){ const { error } = await sb.from("hw_questions").upsert(rows); if(error) throw error; }

    }catch(e){ toast("השמירה נכשלה: "+e.message); $("#save").disabled=false; }
    $("#save").textContent = "שמירה";

}
function toStudentQ(q){ const v = sampleVals(q.params); return { id:q.id, prompt:fillVals(q.prompt, v), kind:q.kind, choices:q.choices, points:q.points, figure:fillVals(q.figure, v), unit: q.kind==="number" ? (q.answer?.unit||null) : null }; }
function renderPv(i){
  const q = Q[i], pv = $(`#pv${i}`); if(!q || !pv) return;
  const s = toStudentQ(q);
  pv.innerHTML = `<div class="q"><div class="qh"><span class="qn">${i+1}</span><div class="body"><div class="prompt">${esc(s.prompt||"נוסח השאלה יופיע כאן")}</div>${figHtml(s.figure)}${answerInput(s,"")}
    <div class="tiny" style="margin-top:8px;color:var(--ok);font-weight:700">${q.kind==="number"?`תשובה: <bdi class="ltr">${esc(answerText(q))}</bdi>${q.answer.formula?" (לדוגמה, עם הערכים הנמוכים)":""}`:q.kind==="text"?`מתקבל: ${esc((q.answer.accepted||[]).join(" / "))}`:""}</div></div></div></div>`;
  if(q.kind==="choice"){ const c = pv.querySelectorAll(".choice")[+q.answer.index]; if(c) c.classList.add("right"); }
  pv.querySelectorAll("input").forEach(x=>x.disabled=true);
  math(pv);
}
function normalizeQ(x){
  const kind = ["number","choice","text"].includes(x.kind) ? x.kind : (x.choices ? "choice" : "number");
  let answer = x.answer ?? {};
  if(kind==="number"){
    if(typeof answer !== "object") answer = { value: answer };
    const a = { unit: answer.unit ?? x.unit ?? "" };
    if(answer.formula) a.formula = String(answer.formula); else { a.value = Number(answer.value); if(isNaN(a.value)) throw new Error("חסר ערך מספרי בשאלה: "+(x.prompt||"").slice(0,30)); }
    if(answer.tol_pct!=null) a.tol_pct = Number(answer.tol_pct);
    answer = a;
  } else if(kind==="choice"){ if(typeof answer !== "object") answer = { index: answer }; answer = { index: Number(answer.index ?? 0) }; }
  else { if(typeof answer === "string") answer = { accepted:[answer] }; answer = { accepted: (answer.accepted||[]).map(String) }; }
  return { id:uuid(), assignment_id:A.id, prompt:String(x.prompt||""), kind, choices: kind==="choice" ? (x.choices||[]).map(String) : null, answer, points: Number(x.points ?? 1),
    figure: (typeof x.figure==="string" && /^\s*<svg/i.test(x.figure)) ? x.figure : null, topic:x.topic||null, hint:x.hint||null, hint_penalty:Number(x.hint_penalty||0), solution:x.solution||null, params:x.params||null, _new:true };
}
function qEditor(q,i){
  const k = q.kind;
  let ans = "";
  if(k==="number") ans = `
    <div class="row" style="align-items:flex-end">
      <div class="grow" style="min-width:120px"><label class="f">תשובה נכונה</label><input type="text" class="ltr" data-f="value" value="${esc(q.answer.value??"")}" inputmode="decimal" ${q.answer.formula?"disabled placeholder='לפי הנוסחה'":""}></div>
      <div style="width:120px"><label class="f">טווח מותר %</label><input type="number" min="0" step="0.1" class="ltr" data-f="tol_pct" value="${q.answer.tol_pct??""}" placeholder="אוטומטי"></div>
      <div style="width:110px"><label class="f">יחידות</label><input type="text" class="ltr" data-f="unit" value="${esc(q.answer.unit||"")}"></div></div>
    <p class="muted tiny" style="margin:6px 0 0">טווח אוטומטי: מספר שלם חייב להיות מדויק, מספר לא שלם מקבל 1%.</p>
    <details ${q.answer.formula?"open":""}><summary>מספרים שונים לכל תלמיד</summary><div>
      <p class="muted tiny" style="margin:8px 0 0">כתבו בשאלה {a}, {b} במקום המספרים. לכל תלמיד ייבחרו מספרים אחרים, והתשובה תחושב לפי הנוסחה.</p>
      <label class="f">טווחים</label><input type="text" class="ltr" data-f="params" value="${esc(paramsText(q.params))}" placeholder="a=4..9, b=10..15, h=3..6">
      <div class="err tiny perr" style="margin-top:4px"></div>
      <label class="f">נוסחה לתשובה</label><input type="text" class="ltr" data-f="formula" value="${esc(q.answer.formula||"")}" placeholder="(a+b)*h/2   ·   sqrt(a^2+b^2)   ·   2*pi*r"></div></details>`;
  else if(k==="choice") ans = `<label class="f">אפשרויות <span class="muted">כל אחת בשורה</span></label><textarea data-f="choices" style="min-height:96px">${esc((q.choices||[]).join("\n"))}</textarea>
      <label class="f">התשובה הנכונה</label><select data-f="correct">${(q.choices||[]).map((c,j)=>`<option value="${j}" ${+q.answer.index===j?"selected":""}>${HEB[j]||j+1}. ${esc(c.slice(0,60))}</option>`).join("")}</select>`;
  else ans = `<label class="f">תשובות שמתקבלות <span class="muted">כל אחת בשורה. רווחים, מקפים ואותיות גדולות לא משנים</span></label><textarea data-f="accepted" style="min-height:64px">${esc((q.answer.accepted||[]).join("\n"))}</textarea>`;
  return `<div class="qedit" data-i="${i}">
    <div class="head"><span class="qn">${i+1}</span>
      <select data-f="kind" style="width:auto;padding:7px 10px 7px 32px" aria-label="סוג תשובה"><option value="number" ${k==="number"?"selected":""}>תשובה מספרית</option><option value="choice" ${k==="choice"?"selected":""}>אמריקאית</option><option value="text" ${k==="text"?"selected":""}>מילה או ביטוי</option></select>
      <input type="number" min="0" step="0.5" data-f="points" value="${esc(q.points)}" style="width:64px;padding:7px 8px" aria-label="נקודות"><span class="muted small">נק׳</span>
      <span class="grow"></span>
      <button class="ghost sm" data-act="up" aria-label="למעלה">▲</button><button class="ghost sm" data-act="down" aria-label="למטה">▼</button><button class="ghost sm" data-act="dup">שכפול</button><button class="ghost danger sm" data-act="del">מחיקה</button></div>
    <div class="inner">
      <label class="f">השאלה <span class="muted">נוסחאות בין סימני $, למשל $v=\\frac{d}{t}$</span></label>
      <textarea data-f="prompt">${esc(q.prompt)}</textarea>
      <label class="f">נושא</label><input type="text" data-f="topic" list="topics" value="${esc(q.topic||"")}" placeholder="למשל: טרפז">
      ${ans}
      <details ${q.hint||q.solution?"open":""}><summary>רמז ופתרון</summary><div>
        <label class="f">רמז <span class="muted">התלמיד יכול לפתוח בזמן הפתרון</span></label><textarea data-f="hint" style="min-height:56px">${esc(q.hint||"")}</textarea>
        <label class="f">כמה נקודות הרמז מוריד</label><input type="number" min="0" step="0.5" data-f="hint_penalty" value="${q.hint_penalty||0}" style="width:110px">
        <label class="f">פתרון מלא <span class="muted">מוצג לתלמיד אחרי ההגשה</span></label><textarea data-f="solution" style="min-height:70px">${esc(q.solution||"")}</textarea></div></details>
      <details><summary>${q.figure?"שרטוט (יש)":"שרטוט"}</summary><div><textarea data-f="figure" class="ltr" style="min-height:60px;font-size:12px;margin-top:8px" placeholder="קוד SVG. אפשר לבקש מ-Claude לשרטט">${esc(q.figure||"")}</textarea></div></details>
      <div class="label" style="margin-top:16px">כך התלמיד רואה</div>
      <div class="preview" id="pv${i}"></div>
    </div></div>`;
}
function tabPreview(){
  const el = $("#tab");
  el.innerHTML = `
    <div class="info">כך התלמידים רואים את המשימה. אפשר לענות ולבדוק, ושום דבר לא נשמר.${dirty?" כולל שינויים שעוד לא נשמרו.":""}${Q.some(q=>q.answer?.formula)?" בשאלות עם מספרים משתנים מוצגים הערכים הנמוכים.":""}</div>
    ${A.description ? `<p class="prompt">${esc(A.description)}</p>` : ""}
    <div class="card flat"><div class="bd" id="qs">
      ${Q.length ? Q.map((q,i)=>{ const s = toStudentQ(q); return `<div class="q" data-id="${q.id}"><div class="qh"><span class="qn">${i+1}</span><div class="body"><div><span class="prompt">${esc(s.prompt)}</span>${q.points!=1?` <span class="pts">${q.points} נק׳</span>`:""}</div>
        ${figHtml(s.figure)}${answerInput(s,"")}${q.hint?`<div class="hintbox"><b>רמז:</b> ${esc(q.hint)}</div>`:""}<div class="slot"></div></div></div></div>`; }).join("") : `<div class="empty"><b>אין שאלות עדיין</b></div>`}
    </div></div>
    <div class="row"><button class="primary" id="pvcheck">בדיקת התשובות</button><button class="light" id="pvshow">הצגת התשובות</button><button class="ghost" id="pvreset">ניקוי</button></div>
    <div id="pvout"></div>`;
  math(el); bindKeys(el); bindChoices(el);
  const mark = showAll => {
    const ans = collect(el); let sc=0, mx=0;
    Q.forEach(q => { const slot = el.querySelector(`.q[data-id="${q.id}"] .slot`); const ok = checkLocal(q, ans[q.id]); mx += q.points; if(ok) sc += q.points;
      slot.innerHTML = (showAll ? `<div class="mark ok"><b>התשובה:</b> <bdi class="ltr">${esc(answerText(q))}</bdi></div>`
        : ok ? `<div class="mark ok"><b>נכון</b></div>` : `<div class="mark bad"><b>לא נכון.</b> התשובה: <bdi class="ltr">${esc(answerText(q))}</bdi></div>`) + (q.solution?`<div class="sol"><span class="label">פתרון</span><div class="prompt">${esc(q.solution)}</div></div>`:""); });
    $("#pvout").innerHTML = showAll ? "" : `<div class="card"><div class="bd"><div class="grade"><div><div class="label">ציון לדוגמה</div><div class="n ${band(pct(sc,mx))}">${pct(sc,mx)}</div></div><div class="muted">${sc} מתוך ${mx} נקודות</div></div>${cells(pct(sc,mx), true)}</div></div>`;
    math(el);
  };
  $("#pvcheck").onclick = () => mark(false); $("#pvshow").onclick = () => mark(true); $("#pvreset").onclick = () => tabPreview();
}
function tabSettings(){
  const el = $("#tab");
  const loc = d => d ? new Date(new Date(d).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
  el.innerHTML = `<div class="card"><div class="bd">
    <label class="f" for="s_title">שם המשימה</label><input id="s_title" type="text" value="${esc(A.title)}">
    <label class="f">סוג</label><div class="seg" id="s_mode"><button data-m="homework">שיעורי בית</button><button data-m="exam">מבחן</button><button data-m="practice">תרגול חופשי</button></div>
    <p class="muted tiny" id="s_mode_d" style="margin:6px 0 0"></p>
    <label class="f">כיתות</label>
    ${CL.length ? CL.map(c=>`<label class="chk" style="margin:6px 0"><input type="checkbox" class="s_cls" value="${c.id}" ${ACL.includes(c.id)?"checked":""}><span>${esc(c.name)}</span></label>`).join("") : `<p class="muted small">אין עדיין כיתות.</p>`}
    <label class="f" for="s_desc">הוראות לתלמידים <span class="muted">לא חובה</span></label><textarea id="s_desc">${esc(A.description||"")}</textarea>
    <div class="grid2" style="gap:0 16px">
      <div><label class="f" for="s_open">פתיחה אוטומטית <span class="muted">לא חובה</span></label><input id="s_open" type="datetime-local" value="${loc(A.opens_at)}"></div>
      <div><label class="f" for="s_due">מועד אחרון <span class="muted">לא חובה</span></label><input id="s_due" type="datetime-local" value="${loc(A.due_at)}"></div>
      <div><label class="f" for="s_att">ניסיונות לכל תלמיד</label><select id="s_att">${[1,2,3,5].map(n=>`<option value="${n}" ${A.max_attempts===n?"selected":""}>${n===1?"הגשה אחת":n}</option>`).join("")}<option value="" ${A.max_attempts==null?"selected":""}>ללא הגבלה</option></select></div>
      <div><label class="f" for="s_w">משקל בממוצע</label><select id="s_w">${[0.5,1,2,3].map(n=>`<option value="${n}" ${+A.weight===n?"selected":""}>×${n}</option>`).join("")}</select></div>
      <div id="s_tl_w"><label class="f" for="s_tl">זמן למבחן בדקות <span class="muted">ריק = בלי הגבלה</span></label><input id="s_tl" type="number" min="1" max="600" value="${A.time_limit_min??""}"></div>
    </div>
    <label class="chk" style="margin-top:18px"><input type="checkbox" id="s_shuf" ${A.shuffle?"checked":""}><span>ערבוב סדר השאלות והתשובות לכל תלמיד<br><span class="muted small">כל תלמיד מקבל סדר אחר, וזה מקשה על העתקות.</span></span></label>
    <label class="chk"><input type="checkbox" id="s_show" ${A.show_results?"checked":""}><span>להראות לתלמיד ציון ותשובות נכונות אחרי ההגשה<br><span class="muted small">אם תכבו, התלמידים יראו רק "הוגש". אפשר להדליק אחר כך.</span></span></label>
    <div class="row" style="margin-top:20px"><button class="primary" id="s_save">שמירת ההגדרות</button></div>
  </div></div>
  <div class="card"><div class="hd"><h2>עוד פעולות</h2></div><div class="bd"><div class="row"><button class="light sm" id="s_dup">שכפול המשימה</button><button class="light sm" onclick="go('#/teacher/print/${A.id}')">הדפסה כדף עבודה</button><button class="btn-danger sm" id="s_del">מחיקת המשימה</button></div></div></div>`;
  let mode = A.mode;
  const desc = { homework:"הגשה עם ציון שנכנס לממוצע.", exam:"עם שעון. השעון מתחיל כשהתלמיד לוחץ התחלה, ובסוף הזמן התשובות נשלחות לבד.", practice:"בלי ציון בממוצע, בלי הגבלת ניסיונות, ותמיד מראה תשובות." };
  const drawMode = () => { $$("#s_mode button").forEach(b=>b.classList.toggle("on", b.dataset.m===mode)); $("#s_mode_d").textContent = desc[mode]; $("#s_tl_w").style.display = mode==="exam" ? "" : "none"; };
  $$("#s_mode button").forEach(b => b.onclick = () => { mode = b.dataset.m; if(mode==="exam" && !$("#s_tl").value) $("#s_tl").value = 45; drawMode(); });
  drawMode();
  $("#s_save").onclick = async () => {
    const iso = id => $(id).value ? new Date($(id).value).toISOString() : null;
    const upd = { title:$("#s_title").value.trim()||"משימה ללא שם", description:$("#s_desc").value, mode, opens_at:iso("#s_open"), due_at:iso("#s_due"),
      max_attempts: $("#s_att").value? +$("#s_att").value : null, weight:+$("#s_w").value, time_limit_min: mode==="exam" && $("#s_tl").value ? Math.max(1,+$("#s_tl").value) : null,
      shuffle:$("#s_shuf").checked, show_results:$("#s_show").checked };
    const { error } = await sb.from("hw_assignments").update(upd).eq("id",A.id);
    if(error) return toast(error.message);
    const want = $$(".s_cls:checked").map(x=>x.value), add = want.filter(x=>!ACL.includes(x)), del = ACL.filter(x=>!want.includes(x));
    if(add.length){ const r = await sb.from("hw_assignment_classes").insert(add.map(c=>({ assignment_id:A.id, class_id:c }))); if(r.error) return toast(r.error.message); }
    if(del.length){ const r = await sb.from("hw_assignment_classes").delete().eq("assignment_id",A.id).in("class_id",del); if(r.error) return toast(r.error.message); }
    ACL = want; Object.assign(A, upd); $("#ttl").textContent = A.title; drawAssignHeader(); toast("ההגדרות נשמרו");
  };
  $("#s_dup").onclick = async () => {
    const { data:n, error } = await sb.from("hw_assignments").insert({ title:A.title+" (עותק)", description:A.description, is_open:false, show_results:A.show_results, max_attempts:A.max_attempts, mode:A.mode, time_limit_min:A.time_limit_min, shuffle:A.shuffle, weight:A.weight }).select("id").single();
    if(error) return toast(error.message);
    if(Q.length){ const r = await sb.from("hw_questions").insert(Q.map((q,i)=>({ assignment_id:n.id, position:i+1, prompt:q.prompt, kind:q.kind, choices:q.choices, answer:q.answer, points:q.points, figure:q.figure||null, topic:q.topic, hint:q.hint, hint_penalty:q.hint_penalty, solution:q.solution, params:q.params }))); if(r.error) return toast(r.error.message); }
    toast("נוצר עותק. בחרו לו כיתה"); go("#/teacher/a/"+n.id+"?tab=settings");
  };
  $("#s_del").onclick = async () => {
    if(!(await ask(`<h2>למחוק את "${esc(A.title)}"?</h2><p class="muted">כל השאלות וכל ההגשות יימחקו. אי אפשר לבטל.</p>`, "מחיקה", "ביטול", true))) return;
    const { error } = await sb.from("hw_assignments").delete().eq("id",A.id); if(error) return toast(error.message); go("#/teacher?tab=a");
  };
}
/* ---- printable worksheet ---- */
async function teacherPrint(id){
  if(!(await requireTeacher())) return;
  const [{data:a}, {data:qs}] = await Promise.all([ sb.from("hw_assignments").select("*").eq("id",id).single(), sb.from("hw_questions").select("*").eq("assignment_id",id).order("position") ]);
  if(!a) return;
  Q = qs || [];
  const draw = key => {
    app().innerHTML = `
      <div class="noprint row" style="margin-bottom:12px">${backBtn("חזרה למשימה","#/teacher/a/"+id)}<span class="grow"></span><label class="chk" style="margin:0"><input type="checkbox" id="pk" ${key?"checked":""}><span>עם תשובות</span></label><button class="primary sm" onclick="print()">הדפסה</button></div>
      <div class="card"><div class="bd">
        <div class="row" style="border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px"><div class="grow"><h1 style="margin:0">${esc(a.title)}</h1>${a.description?`<div class="prompt small muted">${esc(a.description)}</div>`:""}</div><div class="small" style="text-align:left">שם: ____________<br>כיתה: ________</div></div>
        ${Q.map((q,i)=>{ const s = toStudentQ(q); return `<div class="q"><div class="qh"><span class="qn">${i+1}</span><div class="body"><div class="prompt">${esc(s.prompt)}</div>${figHtml(s.figure)}
          ${q.kind==="choice" ? `<div style="margin-top:10px">${q.choices.map((c,j)=>`<div style="padding:4px 0">${HEB[j]}. <span class="prompt">${esc(c)}</span></div>`).join("")}</div>` : `<div style="margin-top:14px;border-bottom:1px solid var(--ink);width:240px;height:28px"></div>`}
          ${key?`<div class="tiny" style="margin-top:6px;color:var(--ok);font-weight:800">תשובה: <bdi>${esc(answerText(q))}</bdi></div>`:""}</div></div></div>`; }).join("")}
      </div></div>`;
    math(app()); $("#pk").onchange = e => draw(e.target.checked);
  };
  draw(false);
}

/* ================= boot ================= */
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("load", async () => {
  if(!window.supabase){ app().innerHTML = `<div class="card"><div class="bd"><p class="err">האתר לא נטען עד הסוף. בדקו את החיבור לאינטרנט ורעננו.</p></div></div>`; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { session = s; });
  route();
});
</script>
