<html lang="he" dir="rtl">

<title>מחברת · שיעורי בית</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23fff' stroke='%2316213E' stroke-width='2'/%3E%3Cpath d='M9 3v26M3 11h26M3 19h26' stroke='%23C9D5E3' stroke-width='1.2'/%3E%3Cpath d='M12 17l4 4 8-10' fill='none' stroke='%23D3262F' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  /* teacher's red-pen handwriting: Playpen Sans Hebrew (OFL), self-hosted, no emoji subset */
  @font-face{font-family:"Hand";font-weight:700;font-display:swap;src:url(fonts/playpen-hebrew-700.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+FB1D-FB4F}
  @font-face{font-family:"Hand";font-weight:700;font-display:swap;src:url(fonts/playpen-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF}
  :root{
    --paper:#F5F8FB; --grid:#E2E9F1; --sheet:#fff; --line:#D8E0EA; --line-2:#E9EEF4;
    --ink:#16213E; --muted:#5B6880; --faint:#8A95A8;
    --pen:#2741B5; --pen-2:#1E3492; --pen-wash:#EEF1FC;
    --red:#D3262F; --red-wash:#FDF0F0; --margin:#F3A6AE; --marker:#FFE15A;
    --ok:#17794A; --ok-wash:#EAF6EF;
    --hand:"Hand","IBM Plex Sans Hebrew",sans-serif;
    --r-sheet:6px; --r-ctl:10px;
    --shadow:0 1px 0 var(--line), 0 10px 28px -18px rgba(22,33,62,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--ink);
    font:400 16px/1.6 "IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px; background-position:-1px -1px;
    min-height:100vh;
  }
  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  header .in{max-width:760px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:none;padding:0}
  .brand svg{width:28px;height:28px;flex:none}
  .brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;line-height:1.1}
  header .sp{flex:1}
  #hdr{display:flex;align-items:center;gap:6px}
  main{max-width:760px;margin:auto;padding:22px 18px 120px}
  /* ---------- type ---------- */
  h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:6px 0 4px}
  h2{font-size:18px;line-height:1.3;font-weight:700;margin:0 0 12px}
  p{margin:0 0 10px}
  .muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
  .hand{font-family:var(--hand);color:var(--red);font-weight:700}
  .ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
  .num{font-variant-numeric:tabular-nums}
  .katex{direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:1.06em}
  .katex-display{direction:ltr}
  .prompt{white-space:pre-wrap}
  /* ---------- sheet (notebook page) ---------- */
  .sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-sheet);box-shadow:var(--shadow);padding:18px 20px 18px 20px;padding-inline-start:60px;margin:14px 0}
  .sheet::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:48px;width:2px;background:var(--margin);opacity:.85}
  .sheet.plain{padding-inline-start:20px} .sheet.plain::before{display:none}
  .sheet > h2:first-child{margin-top:2px}
  /* ---------- controls ---------- */
  button,.btn{font:inherit;font-weight:600;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:var(--r-ctl);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;transition:background .15s,border-color .15s,box-shadow .15s}
  button:hover,.btn:hover{border-color:#BCC8D8;background:#FBFCFE}
  button:active{transform:translateY(1px)}
  .primary{background:var(--pen);border-color:var(--pen);color:#fff}
  .primary:hover{background:var(--pen-2);border-color:var(--pen-2)}
  .big{font-size:17px;padding:13px 22px}
  .wide{width:100%}
  .ghost{border-color:transparent;background:transparent;color:var(--pen);padding:6px 8px}
  .ghost:hover{background:var(--pen-wash);border-color:transparent}
  .danger{color:var(--red)} .danger.ghost:hover{background:var(--red-wash)}
  .wa{background:#fff;border-color:#BFE3CC;color:#11753F}
  .wa:hover{background:#F1FAF4;border-color:#9AD3AE}
  button:disabled{opacity:.5;cursor:default;transform:none}
  :focus-visible{outline:3px solid color-mix(in srgb,var(--pen) 40%,transparent);outline-offset:2px}
  label.f{display:block;font-size:14px;font-weight:500;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid #C9D3E0;border-radius:8px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:92px;resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-wash)}
  input::placeholder,textarea::placeholder{color:#A3AEBF}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px;cursor:pointer}
  .chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--pen);flex:none}
  .err{color:var(--red);font-weight:500;margin:10px 0 0}
  /* ---------- chips ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap}
  .chip.pen{border-color:#C7D0F2;color:var(--pen);background:var(--pen-wash)}
  .chip.ok{border-color:#BFE3CC;color:var(--ok);background:var(--ok-wash)}
  .chip.late{border-color:#F4C6C9;color:var(--red);background:var(--red-wash)}
  .marker{background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 92%,transparent 92%);padding:0 2px;font-weight:600;color:var(--ink)}
  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:18px 0 0;overflow-x:auto;scrollbar-width:none}
  .tabs button{border:none;border-radius:8px 8px 0 0;background:none;padding:10px 14px;color:var(--muted);font-weight:600;position:relative;white-space:nowrap}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;inset-inline:10px;bottom:-1.5px;height:3px;border-radius:3px;background:var(--pen)}
  .seg{display:flex;background:#EEF2F7;border-radius:12px;padding:4px;margin:4px 0 6px}
  .seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(22,33,62,.12)}
  /* ---------- ruled list (lines on one sheet) ---------- */
  .ruled > .li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line-2);cursor:pointer;position:relative}
  .ruled > .li:first-child{border-top:none}
  .ruled > .li.off{cursor:default}
  .ruled > .li:not(.off):hover .t{color:var(--pen)}
  .li .when{position:absolute;inset-inline-start:-60px;width:48px;text-align:center;font-size:12px;line-height:1.15;color:var(--muted);font-weight:600}
  .li .t{font-weight:600;transition:color .15s}
  .li .sub{font-size:13.5px;color:var(--muted);margin-top:1px}
  .li .end{display:flex;align-items:center;gap:8px;flex:none}
  .chev{width:16px;height:16px;color:#A3AEBF;flex:none}
  /* ---------- grade (the one bold thing) ---------- */
  .grade{position:relative;display:inline-grid;place-items:center;min-width:54px;height:40px;font-family:var(--hand);font-weight:700;color:var(--red);font-size:21px;line-height:1}
  .grade svg{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);overflow:visible}
  .grade.big{min-width:150px;height:104px;font-size:60px}
  .grade.big svg{inset:-10px -22px;width:calc(100% + 44px);height:calc(100% + 20px)}
  .grade path{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round}
  .grade.big path{stroke-width:3.2}
  .grade.draw path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .9s .25s cubic-bezier(.6,.1,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.grade.draw path{animation:none;stroke-dashoffset:0}}
  .result{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  /* ---------- questions ---------- */
  .q{position:relative;padding:18px 0;border-top:1px solid var(--line-2)}
  .q:first-child{border-top:none;padding-top:4px}
  .qn{position:absolute;inset-inline-start:-60px;top:18px;width:48px;text-align:center;font-weight:700;color:var(--pen);font-size:15px}
  .q:first-child .qn{top:4px}
  .q .pts{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
  .fig{margin:12px 0 4px;text-align:center}
  .fig img{max-width:100%;height:auto;max-height:260px}
  .ans{display:flex;align-items:center;gap:10px;margin-top:12px;max-width:440px}
  .ans input{font-size:18px;font-weight:500;padding:12px 14px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
  .ans .unit{direction:ltr;color:var(--muted);font-weight:600;white-space:nowrap}
  .choices{display:grid;gap:8px;margin-top:12px}
  .choice{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-ctl);cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
  .choice:hover{border-color:#BCC8D8}
  .choice input{width:18px;height:18px;accent-color:var(--pen);margin:0;flex:none}
  .choice.sel{border-color:var(--pen);background:var(--pen-wash)}
  .choice.right{border-color:#9AD3AE;background:var(--ok-wash)}
  .q.answered .qn::after{content:"";position:absolute;inset-inline-end:2px;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--pen)}
  /* teacher marks on a checked answer */
  .mark{display:flex;align-items:baseline;gap:10px;margin-top:10px;padding:8px 12px;border-radius:8px;font-size:15px}
  .mark .sym{font-family:var(--hand);font-weight:700;font-size:24px;line-height:1;color:var(--red);flex:none}
  .mark.ok{background:var(--ok-wash);color:var(--ok)}
  .mark.ok .sym{color:var(--ok)}
  .mark.bad{background:var(--red-wash);color:#8C1D23}
  .mark .fix{font-family:var(--hand);color:var(--red);font-weight:700;font-size:17px}
  .yours{margin-top:8px;font-size:15px;color:var(--muted)}
  .yours b{color:var(--ink);font-weight:600}
  /* ---------- sticky submit bar ---------- */
  .dock{position:fixed;inset-inline:0;bottom:0;z-index:15;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
  .dock .in{max-width:760px;margin:auto;display:flex;align-items:center;gap:14px}
  .progress{flex:1;min-width:0}
  .progress .bar{height:6px;border-radius:6px;background:#E6EBF2;overflow:hidden;margin-top:5px}
  .progress .bar i{display:block;height:100%;background:var(--pen);border-radius:6px;transition:width .25s}
  /* ---------- stats, tables ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:2px 0}
  .stats > div{padding:4px 14px;border-inline-start:1px solid var(--line-2)}
  .stats > div:first-child{border-inline-start:none;padding-inline-start:0}
  .stats .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
  .stats .k{font-size:13px;color:var(--muted);font-weight:500}
  .tw{overflow-x:auto;margin:0 -4px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border-bottom:1px solid var(--line-2);padding:9px 6px;text-align:start;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:13px}
  th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--pen)}
  td.c,th.c{text-align:center}
  .yes{color:var(--ok);font-weight:700} .no{color:var(--red);font-weight:700}
  .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
  .meter{height:8px;background:#E6EBF2;border-radius:99px;overflow:hidden;min-width:70px}
  .meter i{display:block;height:100%;background:var(--pen);border-radius:99px}
  .meter.low i{background:var(--red)}
  /* ---------- misc ---------- */
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--pen);font-weight:600;font-size:15px;background:none;border:none;padding:4px 0;cursor:pointer}
  .back svg{width:16px;height:16px}
  .note{background:#FFF9DB;border:1.5px solid #F3E39A;border-radius:var(--r-ctl);padding:10px 14px;margin:14px 0;font-size:15px}
  .code{font-family:"IBM Plex Sans Hebrew",ui-monospace,monospace;font-weight:700;letter-spacing:.18em;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
  .bigcode{font-size:34px;color:var(--ink);line-height:1.1}
  .empty{text-align:center;padding:26px 10px;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
  .toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:50;font-size:15px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
  .qedit{border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:14px;margin:14px 0;background:#FBFCFE}
  .qedit .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .qedit .badge{width:30px;height:30px;border-radius:8px;background:var(--pen);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  .preview{background:#fff;border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px;margin-top:8px}
  details summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;margin-top:10px}
  dialog{border:none;border-radius:14px;padding:22px;max-width:min(420px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(22,33,62,.45);color:var(--ink)}
  dialog::backdrop{background:rgba(22,33,62,.35)}
  .auth{max-width:420px;margin:28px auto}
  .hero-mark{display:flex;justify-content:center;margin:6px 0 2px}
  .hero-mark svg{width:64px;height:64px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:560px){
    h1{font-size:24px}
    main{padding:16px 12px 120px}
    .sheet{padding:16px 14px;padding-inline-start:52px}
    .sheet::before{inset-inline-start:42px}
    .li .when,.qn{inset-inline-start:-52px;width:42px}
    .stats .v{font-size:24px}
    .grade.big{min-width:120px;height:88px;font-size:50px}
  }
</style>
</head>

<header><div class="in">
  <button class="brand" onclick="go(location.hash.startsWith('#/teacher')?'#/teacher':'#/')" aria-label="מחברת – דף הבית">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="4" fill="#fff" stroke="#16213E" stroke-width="2"/><path d="M9 3v26M3 11h26M3 19h26" stroke="#C9D5E3" stroke-width="1.2"/><path d="M12 17l4 4 8-10" fill="none" stroke="#D3262F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>מחברת<small>שיעורי בית במתמטיקה ופיזיקה</small></span>

<script>
const SUPABASE_URL = "https://cihpuwinkgaumngsftin.supabase.co";
const SUPABASE_KEY = "sb_publishable_uFMJVz_1cBnHK_DEhBNlHg_5_SdFhOK";
let sb = null, session = null;
const OTP_LEN = 6;

/* ================= helpers ================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = () => $("#app");
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function toast(msg){ $$(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function math(el){
  if(!el || !window.renderMathInElement) return;
  try{ renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false}); }catch(e){}
}
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
const errMsg = e => (e?.message || String(e));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=="x"?r:(r&3|8)).toString(16);}));
const pad = n => String(n).padStart(2,"0");
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDate = d => d ? new Date(d).toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const dayMonth = d => { const x = new Date(d); return `${x.getDate()}.${x.getMonth()+1}`; };
const pct = (s,m) => m ? Math.round(100*s/m) : 0;
const siteBase = () => location.origin + location.pathname;
const isPast = d => d && new Date(d) < new Date();
function relDue(d){
  if(!d) return "";
  const t = new Date(d), now = new Date();
  if(t < now) return "המועד עבר";
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((day(t) - day(now)) / 864e5);
  if(days === 0) return `היום עד ${hm(t)}`;
  if(days === 1) return `מחר עד ${hm(t)}`;
  if(days < 7) return `בעוד ${days} ימים`;
  return `עד ${dayMonth(t)}`;
}
const figHtml = f => (f && /^\s*<svg[\s>]/i.test(f)) ? `<div class="fig"><img alt="שרטוט לשאלה" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(f.trim())}"></div>` : "";

/* the circled grade, hand-drawn once */
function gradeHtml(v, big=false, draw=false){
  const path = big ? "M86,8 C40,4 8,22 9,52 C10,82 46,99 88,97 C134,95 168,78 167,48 C166,18 132,5 80,11"
                   : "M40,4 C18,3 3,11 4,21 C5,32 20,38 41,37 C63,36 76,29 75,19 C74,9 60,3 37,6";
  const vb = big ? "0 0 176 104" : "0 0 80 41";
  return `<span class="grade ${big?"big":""} ${draw?"draw":""}"><svg viewBox="${vb}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}"/></svg><span class="num">${v}</span></span>`;
}
function waShare(text){ return `https://wa.me/?text=${encodeURIComponent(text)}`; }
async function copy(text, okMsg){ try{ await navigator.clipboard.writeText(text); toast(okMsg); }catch(e){ prompt("העתיקו:", text); } }
function ask(html, okLabel="אישור", cancelLabel="ביטול", danger=false){
  return new Promise(res => {
    const d = $("#dlg");
    d.innerHTML = `${html}<div class="row" style="margin-top:18px;justify-content:flex-end"><button data-v="0">${cancelLabel}</button><button class="${danger?"primary danger":"primary"}" data-v="1" ${danger?'style="background:var(--red);border-color:var(--red);color:#fff"':""}>${okLabel}</button></div>`;
    math(d);
    d.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { d.close(); res(b.dataset.v==="1"); });
    d.oncancel = () => res(false);
    d.showModal();
  });
}

/* ================= router ================= */
let navSeq = 0;
async function route(){
  navSeq++;
  const h = location.hash || "#/";
  window.scrollTo(0,0);
  renderHeader();
  let m;
  if((m = h.match(/^#\/join\/([A-Za-z0-9]+)/))) return studentAuth("register", m[1].toUpperCase());
  if((m = h.match(/^#\/s\/([0-9a-f-]+)/))) return studentAssignment(m[1]);
  if(h.startsWith("#/teacher/a/")) return teacherAssignment(h.split("/")[3]);
  if(h.startsWith("#/teacher/c/")) return teacherClass(h.split("/")[3]);
  if(h.startsWith("#/teacher")) return teacherHome();
  return studentHome();
}
function renderHeader(){
  const h = location.hash || "";

async function rpcS(fn, args){
  const { data, error } = await sb.rpc(fn, { p_token: store("hw-token"), ...args });
  if(error){
    if(/להתחבר מחדש/.test(error.message)){ store("hw-token", null); toast("צריך להתחבר שוב"); go("#/"); }
    throw error;
  }
  return data;
}

  store("hw-token", null); go("#/");
}

  if(seq!==navSeq) return;
  const canSubmit = a.is_open && !isPast(a.due_at) && (a.max_attempts==null || a.attempts < a.max_attempts);
  app().innerHTML = `
    ${backBtn("המשימות שלי","#/")}
    <h1>${esc(a.title)}</h1>
    <div class="row" style="margin:6px 0 4px">${a.due_at?`<span class="chip ${isPast(a.due_at)?"late":""}">${isPast(a.due_at)?"המועד עבר":`<span class="marker" style="background:none;padding:0">${relDue(a.due_at)}</span>`}</span>`:""}<span class="chip">${a.questions.length} שאלות</span>${a.max_attempts!=null?`<span class="chip">${a.max_attempts===1?"הגשה אחת":`${a.max_attempts} ניסיונות`}</span>`:""}</div>
    ${a.description ? `<p class="prompt" style="margin-top:12px">${esc(a.description)}</p>` : ""}
    <div id="body"></div>`;
  math(app());
  const body = $("#body");
  if(a.last){
    showReview(body, a, a.last);
    if(canSubmit){
      const left = a.max_attempts==null ? "" : `נשארו ${Math.max(0,a.max_attempts-a.attempts)} ניסיונות. `;
      const b = document.createElement("div"); b.className = "note";
      b.innerHTML = `<div class="row"><div class="grow">${left}הציון האחרון הוא שנחשב.</div><button class="primary">לנסות שוב</button></div>`;
      b.querySelector("button").onclick = () => showForm(body, a);
      body.prepend(b);
    }
  } else if(canSubmit) showForm(body, a);
  else body.innerHTML = `<div class="sheet"><div class="empty"><b>המשימה סגורה להגשה</b>אם זו טעות, פנו למורה.</div></div>`;
}
function showForm(body, a){
  const dkey = "hw-draft-"+a.id;
  const draft = store(dkey) || {};
  body.innerHTML = `
    <div class="sheet" id="qs">
      ${a.questions.map((q,i)=>`
        <div class="q" data-id="${q.id}">
          <span class="qn">${i+1}</span>
          <div><span class="prompt">${esc(q.prompt)}</span>${q.points!=1?` <span class="pts">(${q.points} נק׳)</span>`:""}</div>
          ${figHtml(q.figure)}${answerInput(q, draft[q.id] ?? "")}
        </div>`).join("")}
    </div>
    <div id="out"></div>
    <div class="dock"><div class="in">
      <div class="progress"><div class="small"><b id="pc">0</b> מתוך ${a.questions.length} נענו <span class="muted tiny" id="saved"></span></div><div class="bar"><i id="pb" style="width:0"></i></div></div>
      <button class="primary big" id="sub">הגשה</button>
    </div></div>`;
  math(body);
  const refresh = () => {
    const ans = collect(); const n = a.questions.filter(q => ans[q.id]).length;
    $("#pc").textContent = n; $("#pb").style.width = (100*n/Math.max(1,a.questions.length))+"%";
    $$("#qs .q").forEach(el => el.classList.toggle("answered", !!ans[el.dataset.id]));
    return { ans, n };
  };
  refresh();
  let saveT;
  const save = () => { store(dkey, collect()); refresh(); clearTimeout(saveT); $("#saved").textContent = "· טיוטה נשמרה"; saveT = setTimeout(()=>{ const s=$("#saved"); if(s) s.textContent=""; }, 1500); };
  body.oninput = save;
  body.onchange = e => { save(); if(e.target.type==="radio") e.target.closest(".q").querySelectorAll(".choice").forEach(c=>c.classList.toggle("sel", c.contains(e.target))); };
  $("#sub").onclick = async () => {
    const { ans, n } = refresh();
    const missing = a.questions.length - n;
    const final = a.max_attempts!=null && a.attempts + 1 >= a.max_attempts;
    if(missing){
      const firstEmpty = a.questions.findIndex(q => !ans[q.id]);
      const ok = await ask(`<h2>חסרות ${missing} תשובות</h2><p class="muted">שאלה ${firstEmpty+1} עוד ריקה. שאלה בלי תשובה נחשבת שגויה.</p>`, "להגיש בכל זאת", "לחזור לשאלות");
      if(!ok){ const el = $$("#qs .q")[firstEmpty]; el.scrollIntoView({behavior:"smooth",block:"center"}); const inp = el.querySelector("input"); inp && setTimeout(()=>inp.focus({preventScroll:true}),350); return; }
    } else if(final){
      if(!(await ask(`<h2>להגיש?</h2><p class="muted">ענית על כל השאלות. אחרי ההגשה אי אפשר לשנות תשובות.</p>`, "הגשה", "עוד רגע"))) return;
    }
    $("#sub").disabled = true; $("#sub").textContent = "שולח…";
    let r; try{ r = await rpcS("hw_student_submit", { p_id:a.id, p_answers:ans }); }
    catch(e){ $("#sub").disabled=false; $("#sub").textContent="הגשה"; $("#out").innerHTML=`<p class="err">${esc(errMsg(e))}</p>`; return; }
    store(dkey, null);
    a.attempts = r.attempt;
    showReview(body, a, { score:r.score, max:r.max, results:r.results, answers:ans, at:new Date().toISOString() }, true);
  };
}
function showReview(body, a, last, fresh){
  const res = {}; (last.results||[]).forEach(x => res[x.question_id] = x);
  const graded = last.score != null;
  const right = (last.results||[]).filter(x=>x.correct).length;
  body.innerHTML = `
    <div class="sheet">
      ${graded ? `<div class="result">${gradeHtml(pct(last.score,last.max), true, fresh)}
          <div><h2 style="margin:0">${fresh?"הוגש. הנה הציון שלך":"הציון שלך"}</h2>
          <div class="muted">${right} מתוך ${a.questions.length} תשובות נכונות, ${last.score} מתוך ${last.max} נקודות</div>
          <div class="muted tiny">הוגש ${fmtDate(last.at)}</div></div></div>`
        : `<h2 style="margin:0">${fresh?"ההגשה התקבלה":"הוגש"}</h2><p class="muted" style="margin:4px 0 0">הוגש ${fmtDate(last.at)}. הציון יופיע כאן כשהמורה יפרסם אותו.</p>`}
    </div>
    <div class="sheet">
      ${a.questions.map((q,i)=>{ const x = res[q.id] || {}; const given = (last.answers||{})[q.id] ?? x.given ?? "";
        const shown = q.kind==="choice" && given!=="" ? (q.choices||[])[+given] ?? given : given;
        let fb = "";
        if(x.correct === true) fb = `<div class="mark ok"><span class="sym">✓</span><span>נכון</span></div>`;
        else if(x.correct === false) fb = `<div class="mark bad"><span class="sym">✗</span><span>לא נכון${x.answer!=null?`. התשובה: <bdi class="fix ltr">${esc(x.answer)}</bdi>`:""}</span></div>`;
        return `<div class="q"><span class="qn">${i+1}</span><div><span class="prompt">${esc(q.prompt)}</span></div>${figHtml(q.figure)}
          <div class="yours">התשובה שלך: <b><bdi class="${q.kind==="choice"?"":"ltr"}">${given===""?"לא נענתה":esc(shown)}</bdi></b>${q.unit&&given!==""&&q.kind==="number"?` <bdi class="ltr">${esc(q.unit)}</bdi>`:""}</div>${fb}</div>`; }).join("")}
    </div>
    ${fresh ? `<button class="wide big" onclick="go('#/')">חזרה למשימות</button>` : ""}`;
  math(body);
  if(fresh) window.scrollTo({top:0,behavior:"smooth"});
}
function answerInput(q, val){
  if(q.kind === "choice"){
    return `<div class="choices" role="radiogroup">${(q.choices||[]).map((c,j)=>`
      <label class="choice ${String(val)===String(j)?"sel":""}"><input type="radio" name="q_${q.id}" value="${j}" ${String(val)===String(j)?"checked":""}>
      <span class="prompt">${esc(c)}</span></label>`).join("")}</div>`;
  }
  const im = q.kind === "number" ? `inputmode="decimal"` : "";
  return `<div class="ans"><input type="text" class="ansin" ${im} autocomplete="off" autocorrect="off" spellcheck="false" aria-label="תשובה" value="${esc(val)}" placeholder="${q.kind==="number"?"מספר, למשל 2.5 או 3/4":"התשובה שלך"}">
    ${q.unit?`<span class="unit">${esc(q.unit)}</span>`:""}</div>`;
}
function collect(){
  const out = {};
  $$("#qs .q").forEach(el => {
    const id = el.dataset.id, t = el.querySelector("input.ansin"), r = el.querySelector("input[type=radio]:checked");
    const v = t ? t.value.trim() : (r ? r.value : "");
    if(v !== "") out[id] = v;
  });
  return out;
}

/* results */
let sortBy = "name";
async function tabResults(){
  const el = $("#tab"); el.innerHTML = `<p class="muted" style="margin-top:16px">טוען…</p>`; const seq = navSeq;
  const [{ data:subs, error }, { data:students }] = await Promise.all([
    sb.from("hw_submissions").select("*").eq("assignment_id",A.id).order("created_at"),
    ACL.length ? sb.from("hw_students").select("id,display_name,class_id").in("class_id",ACL).order("display_name") : Promise.resolve({data:[]})
  ]);
  if(seq!==navSeq || !el.isConnected) return;
  if(error){ el.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  const by = {}; subs.forEach(s => { const k = s.student_id || ("n:"+s.student_name.trim().toLowerCase()); (by[k] ||= []).push(s); });
  const cname = Object.fromEntries(CL.map(c=>[c.id,c.name]));
  const rows = (students||[]).map(st => ({ name:st.display_name, cls:cname[st.class_id], key:st.id, subs: by[st.id]||[] }));
  Object.keys(by).forEach(k => { if(!rows.find(r=>r.key===k)) rows.push({ name:by[k][0].student_name, cls:"", key:k, subs:by[k] }); });
  const done = rows.filter(r=>r.subs.length), missing = rows.filter(r=>!r.subs.length);
  if(!rows.length){ el.innerHTML = `<div class="sheet"><div class="empty"><b>${ACL.length?"עוד אין תלמידים בכיתה":"המשימה לא משויכת לכיתה"}</b>${ACL.length?"כשתלמידים יירשמו ויגישו, התוצאות יופיעו כאן.":"בחרו כיתה בלשונית הגדרות."}</div></div>`; return; }
  const lastOf = r => r.subs[r.subs.length-1];
  const sc = r => r.subs.length ? pct(lastOf(r).score,lastOf(r).max_score) : -1;
  const avg = done.length ? Math.round(done.reduce((s,r)=>s+sc(r),0)/done.length) : null;
  const qstat = Q.map(q => { let ok=0,t=0; done.forEach(r=>{ const x=(lastOf(r).results||[]).find(z=>z.question_id===q.id); if(x){t++; if(x.correct) ok++;} }); return { q, pct: t? Math.round(100*ok/t):0, t }; });
  const multi = ACL.length > 1;
  const sorted = [...rows].sort((x,y) => sortBy==="score" ? sc(y)-sc(x) : sortBy==="low" ? (sc(x)<0?999:sc(x))-(sc(y)<0?999:sc(y)) : x.name.localeCompare(y.name,"he"));
  el.innerHTML = `
    <div class="sheet">
      <div class="stats">
        <div><div class="v">${done.length}<span class="muted" style="font-size:16px;font-weight:500"> מתוך ${rows.length}</span></div><div class="k">הגישו</div></div>
        <div><div class="v">${avg ?? "–"}</div><div class="k">ממוצע</div></div>

/* local grading (same rules as the server) for the teacher preview */
function parseNum(s){
  let t = String(s||"").replace(/[−–]/g,"-").replace(/\s/g,"").replace(/[×·⋅]/g,"*").replace(/(\d)[xX](?=10)/,"$1*");
  if(/^-?\d+,\d+$/.test(t)) t = t.replace(",","."); t = t.replace(/,/g,"").replace(/[(){}]/g,"");
  let m;
  if((m = t.match(/^(-?\d*\.?\d+)\*10\^([-+]?\d+)$/))) return +m[1] * Math.pow(10, +m[2]);
  if((m = t.match(/^10\^([-+]?\d+)$/))) return Math.pow(10, +m[1]);
  if((m = t.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/))) return +m[2] ? +m[1] / +m[2] : null;
  if(/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return +t;
  return null;
}
function checkLocal(q, given){
  if(given==null || String(given).trim()==="") return false;
  if(q.kind==="number"){ const g=parseNum(given), v=Number(q.answer.value); if(g==null) return false;
    const tol = Math.max(Number(q.answer.tol_abs||0), Math.abs(v)*Number(q.answer.tol_pct ?? 1)/100); return Math.abs(g-v) <= tol + 1e-12; }
  if(q.kind==="choice") return String(given).trim() === String(q.answer.index);
  const n = x => String(x).replace(/−/g,"-").replace(/·/g,"*").replace(/\s/g,"").toLowerCase();
  return (q.answer.accepted||[]).some(a => n(a) === n(given));
}
function answerText(q){
  if(q.kind==="number") return q.answer.value + (q.answer.unit ? " "+q.answer.unit : "");
  if(q.kind==="choice") return (q.choices||[])[q.answer.index] ?? "";
  return (q.answer.accepted||[])[0] ?? "";
}

function normalizeQ(x){
  const kind = ["number","choice","text"].includes(x.kind) ? x.kind : (x.choices ? "choice" : "number");
  let answer = x.answer ?? {};
  if(kind==="number"){
    if(typeof answer !== "object") answer = { value: answer };
    answer = { value: Number(answer.value), tol_pct: answer.tol_pct ?? 1, unit: answer.unit ?? x.unit ?? "" };
    if(isNaN(answer.value)) throw new Error("חסר ערך מספרי בשאלה: "+(x.prompt||"").slice(0,30));
  } else if(kind==="choice"){
    if(typeof answer !== "object") answer = { index: answer };
    answer = { index: Number(answer.index ?? 0) };
  } else {
    if(typeof answer === "string") answer = { accepted:[answer] };
    answer = { accepted: (answer.accepted||[]).map(String) };
  }
  return { id:uuid(), assignment_id:A.id, prompt:String(x.prompt||""), kind, choices: kind==="choice" ? (x.choices||[]).map(String) : null, answer, points: Number(x.points ?? 1), figure: (typeof x.figure==="string" && /^\s*<svg/i.test(x.figure)) ? x.figure : null, _new:true };
}

  return `<div class="qedit" data-i="${i}">
    <div class="head"><span class="badge num">${i+1}</span>
      <select data-f="kind" style="width:auto" aria-label="סוג תשובה"><option value="number" ${k==="number"?"selected":""}>תשובה מספרית</option><option value="choice" ${k==="choice"?"selected":""}>אמריקאית</option><option value="text" ${k==="text"?"selected":""}>ביטוי או מילה</option></select>
      <input type="number" min="0" step="0.5" data-f="points" value="${esc(q.points)}" style="width:68px" aria-label="נקודות"><span class="muted small">נק׳</span>
      <span class="grow"></span>
      <button class="ghost" data-act="up" aria-label="הזזה למעלה" title="למעלה">▲</button><button class="ghost" data-act="down" aria-label="הזזה למטה" title="למטה">▼</button>
      <button class="ghost" data-act="dup">שכפול</button><button class="ghost danger" data-act="del">מחיקה</button></div>
    <label class="f">השאלה. נוסחאות בין סימני $, למשל $v=\\frac{d}{t}$</label>
    <textarea data-f="prompt">${esc(q.prompt)}</textarea>
    ${ans}
    <details><summary>${q.figure?"שרטוט: יש. לחצו לעריכת הקוד":"הוספת שרטוט (לא חובה)"}</summary>
      <textarea data-f="figure" class="ltr" style="min-height:60px;font-size:12px;margin-top:6px" placeholder="קוד SVG. אפשר לבקש מ-Claude לשרטט">${esc(q.figure||"")}</textarea></details>
    <div class="muted small" style="margin-top:12px">כך התלמיד יראה את השאלה</div>
    <div class="preview" id="pv${i}"></div>
  </div>`;
}

/* settings */
function tabSettings(){
  const el = $("#tab");
  const local = A.due_at ? new Date(new Date(A.due_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
  el.innerHTML = `<div class="sheet">
    <label class="f" for="s_title">שם המשימה</label><input id="s_title" type="text" value="${esc(A.title)}">
    <label class="f">כיתות</label>
    ${CL.length ? CL.map(c=>`<label class="chk"><input type="checkbox" class="s_cls" value="${c.id}" ${ACL.includes(c.id)?"checked":""}><span>${esc(c.name)}</span></label>`).join("") : `<p class="muted small">אין עדיין כיתות. צרו כיתה במסך הראשי, בלשונית "כיתות".</p>`}
    <label class="f" for="s_desc">הוראות לתלמידים (לא חובה)</label><textarea id="s_desc">${esc(A.description||"")}</textarea>
    <div class="row">
      <div class="grow" style="min-width:200px"><label class="f" for="s_due">מועד אחרון (לא חובה)</label><input id="s_due" type="datetime-local" value="${local}"></div>
      <div class="grow" style="min-width:160px"><label class="f" for="s_att">ניסיונות לכל תלמיד</label><select id="s_att">
        ${[1,2,3,5].map(n=>`<option value="${n}" ${A.max_attempts===n?"selected":""}>${n===1?"הגשה אחת":n}</option>`).join("")}<option value="" ${A.max_attempts==null?"selected":""}>ללא הגבלה</option></select></div>
    </div>
    <label class="chk" style="margin-top:16px"><input type="checkbox" id="s_show" ${A.show_results?"checked":""}><span>להראות לתלמיד ציון ותשובות נכונות מיד אחרי ההגשה<br><span class="muted small">אם תכבו, התלמידים יראו רק "הוגש". אפשר להדליק מאוחר יותר, למשל אחרי המועד האחרון.</span></span></label>
    <div class="row" style="margin-top:18px"><button class="primary" id="s_save">שמירת ההגדרות</button></div>
  </div>
  <div class="sheet">
    <h2>עוד פעולות</h2>
    <div class="row"><button id="s_dup">שכפול המשימה</button><span class="muted small grow">עותק סגור עם אותן שאלות, למשל לכיתה אחרת.</span></div>
    <div class="row" style="margin-top:12px"><button class="ghost danger" id="s_del">מחיקת המשימה</button></div>
  </div>`;
  $("#s_save").onclick = async () => {
    const due = $("#s_due").value;
    const upd = { title:$("#s_title").value.trim()||"משימה ללא שם", description:$("#s_desc").value, due_at: due? new Date(due).toISOString(): null,
      max_attempts: $("#s_att").value? +$("#s_att").value : null, show_results:$("#s_show").checked };
    const { error } = await sb.from("hw_assignments").update(upd).eq("id",A.id);
    if(error) return toast(error.message);
    const want = $$(".s_cls:checked").map(x=>x.value);
    const add = want.filter(x=>!ACL.includes(x)), del = ACL.filter(x=>!want.includes(x));
    if(add.length){ const r = await sb.from("hw_assignment_classes").insert(add.map(c=>({ assignment_id:A.id, class_id:c }))); if(r.error) return toast(r.error.message); }
    if(del.length){ const r = await sb.from("hw_assignment_classes").delete().eq("assignment_id",A.id).in("class_id",del); if(r.error) return toast(r.error.message); }
    ACL = want; Object.assign(A, upd); $("#ttl").textContent = A.title; drawAssignHeader(); toast("ההגדרות נשמרו");
  };
  $("#s_dup").onclick = async () => {
    const { data:n, error } = await sb.from("hw_assignments").insert({ title:A.title+" (עותק)", description:A.description, is_open:false, show_results:A.show_results, max_attempts:A.max_attempts }).select("id").single();
    if(error) return toast(error.message);
    if(Q.length){ const r = await sb.from("hw_questions").insert(Q.map((q,i)=>({ assignment_id:n.id, position:i+1, prompt:q.prompt, kind:q.kind, choices:q.choices, answer:q.answer, points:q.points, figure:q.figure||null }))); if(r.error) return toast(r.error.message); }
    toast("נוצר עותק. בחרו לו כיתה"); go("#/teacher/a/"+n.id+"?tab=settings");
  };
  $("#s_del").onclick = async () => {
    if(!(await ask(`<h2>למחוק את "${esc(A.title)}"?</h2><p class="muted">כל השאלות וכל ההגשות של התלמידים יימחקו. אי אפשר לבטל.</p>`, "מחיקה", "ביטול", true))) return;
    const { error } = await sb.from("hw_assignments").delete().eq("id",A.id);
    if(error) return toast(error.message); go("#/teacher");
  };
}

/* ================= boot ================= */
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("load", async () => {
  if(!window.supabase){ app().innerHTML = `<div class="sheet"><p class="err">האתר לא נטען עד הסוף. בדקו את החיבור לאינטרנט ורעננו.</p></div>`; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { session = s; });
  route();
});
</script>
</body>
</html>
