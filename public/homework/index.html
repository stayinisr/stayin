<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שיעורי בית</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e2db;
    --accent:#2f5bd3; --accent-ink:#fff; --ok:#1f8a4c; --ok-bg:#e7f5ec; --bad:#c2410c; --bad-bg:#fdeee6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Assistant","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .in{max-width:860px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
  header .logo{font-weight:800;font-size:19px;letter-spacing:-.2px;cursor:pointer}
  header .logo span{color:var(--accent)}
  header .sp{flex:1}
  main{max-width:860px;margin:auto;padding:22px 18px 80px}
  h1{font-size:26px;margin:4px 0 6px;letter-spacing:-.3px}
  h2{font-size:19px;margin:0 0 10px}
  .muted{color:var(--muted)} .small{font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:140px}
  label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
  .ltr{direction:ltr;text-align:left}
  .katex{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .katex-display{direction:ltr}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer}
  button:hover{border-color:#c9c6bc}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  button.danger{color:var(--bad)}
  button.link{border:none;background:none;color:var(--accent);padding:4px 6px}
  button:disabled{opacity:.55;cursor:default}
  .big{font-size:18px;padding:12px 22px}
  .q{border-top:1px solid var(--line);padding:16px 0}
  .q:first-child{border-top:none;padding-top:4px}
  .qn{font-weight:800;color:var(--accent);margin-left:6px}
  .prompt{white-space:pre-wrap}
  .ansrow{display:flex;gap:8px;align-items:center;margin-top:10px;max-width:420px}
  .unit{direction:ltr;color:var(--muted);font-weight:600;white-space:nowrap}
  .choice{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer}
  .choice input{margin-top:5px}
  .choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,#fff)}
  .res{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:15px}
  .res.ok{background:var(--ok-bg);color:var(--ok)} .res.bad{background:var(--bad-bg);color:var(--bad)}
  .score{font-size:42px;font-weight:800;letter-spacing:-1px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:#eef1f8;color:#3b4a6b}
  .pill.open{background:var(--ok-bg);color:var(--ok)} .pill.closed{background:#f1f0ec;color:var(--muted)}
  .code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:2px;direction:ltr;display:inline-block}
  .list .item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
  .list .item:first-child{border-top:none}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0}
  .tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted)}
  .tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:700}
  .qedit{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:#fcfcfa}
  .preview{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px;white-space:pre-wrap;min-height:20px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:600}
  td.c{text-align:center}
  .tw{overflow-x:auto}
  .yes{color:var(--ok);font-weight:700} .no{color:var(--bad);font-weight:700}
  .err{color:var(--bad);margin-top:8px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:20;font-size:15px}
  .bar{height:8px;background:#eceae4;border-radius:99px;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .hero{text-align:center;padding:40px 10px}
  .hero input{max-width:260px;text-align:center;font-size:24px;letter-spacing:4px;text-transform:uppercase;direction:ltr}
  @media (max-width:560px){ h1{font-size:22px} .card{padding:14px} }
  .stat{flex:1;min-width:120px;margin:0}
  .stat .score{font-size:30px}
  .acard{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
  .acard:first-child{border-top:none}
  .acard.off{cursor:default;opacity:.65}
  .grade{font-weight:800;font-size:20px;min-width:44px;text-align:center}
  .pill.todo{background:#fff4d6;color:#8a5a00}
  .pill.late{background:var(--bad-bg);color:var(--bad)}
  .warn{background:#fff4d6;color:#8a5a00;border-radius:10px;padding:10px 14px;margin:12px 0}
  .seg{display:flex;gap:4px;background:#eceae4;border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:none;border-radius:9px;padding:8px}
  .seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .chk{display:flex;gap:8px;align-items:center;color:var(--ink);margin:6px 0;font-size:16px}
</style>
</head>
<body>
<header><div class="in">
  <div class="logo" onclick="go('#/')">שיעורי<span>.בית</span></div>
  <div class="sp"></div>
  <div id="hdr"></div>
</div></header>
<main id="app"><p class="muted">טוען…</p></main>

<script>
const SUPABASE_URL = "https://cihpuwinkgaumngsftin.supabase.co";
const SUPABASE_KEY = "sb_publishable_uFMJVz_1cBnHK_DEhBNlHg_5_SdFhOK";
let sb = null, session = null;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = () => $("#app");
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function toast(msg){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function math(el){
  if(!el || !window.renderMathInElement) return;
  try{ renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false}); }catch(e){}
}
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function errMsg(e){ return (e?.message || String(e)); }
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=="x"?r:(r&3|8)).toString(16);}));
const fmtDate = d => d ? new Date(d).toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const pct = (s,m) => m ? Math.round(100*s/m) : 0;
const siteBase = () => location.origin + location.pathname;
const isPast = d => d && new Date(d) < new Date();

/* ---------- router ---------- */
async function route(){
  const h = location.hash || "#/";
  window.scrollTo(0,0);
  renderHeader();
  let m;
  if((m = h.match(/^#\/join\/([A-Za-z0-9]+)/))) return studentAuth("register", m[1].toUpperCase());
  if((m = h.match(/^#\/s\/([0-9a-f-]+)/))) return studentAssignment(m[1]);
  if(h.startsWith("#/teacher/a/")) return teacherAssignment(h.split("/")[3]);
  if(h.startsWith("#/teacher/c/")) return teacherClass(h.split("/")[3]);
  if(h.startsWith("#/teacher")) return teacherHome();
  return studentHome();
}
function renderHeader(){
  const h = location.hash || "";
  if(h.startsWith("#/teacher")) $("#hdr").innerHTML = session ? `<button class="link" onclick="logout()">התנתקות</button>` : `<button class="link" onclick="go('#/')">כניסת תלמיד</button>`;
  else $("#hdr").innerHTML = store("hw-token") ? `<button class="link" onclick="studentLogout()">התנתקות</button>` : `<button class="link" onclick="go('#/teacher')">כניסת מורה</button>`;
}

/* ================= STUDENT ================= */
async function rpcS(fn, args){
  const { data, error } = await sb.rpc(fn, { p_token: store("hw-token"), ...args });
  if(error){
    if(/להתחבר מחדש/.test(error.message)){ store("hw-token", null); toast("יש להתחבר מחדש"); go("#/"); }
    throw error;
  }
  return data;
}
async function studentLogout(){
  try{ await sb.rpc("hw_student_logout",{ p_token: store("hw-token") }); }catch(e){}
  store("hw-token", null); go("#/");
}
function studentAuth(mode, code=""){
  app().innerHTML = `
    <div class="card" style="max-width:440px;margin:30px auto">
      <h1 style="text-align:center">שיעורי בית</h1>
      <div class="seg"><button data-m="login">כניסה</button><button data-m="register">הרשמה לכיתה</button></div>
      <form id="af"></form>
      <p class="err" id="ae"></p>
    </div>`;
  const draw = m => {
    document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on", b.dataset.m===m));
    $("#ae").textContent = "";
    $("#af").innerHTML = m==="login" ? `
      <label>שם משתמש</label><input id="u" type="text" class="ltr" autocomplete="username" autocapitalize="none">
      <label>סיסמה</label><input id="p" type="password" class="ltr" autocomplete="current-password">
      <div style="margin-top:16px"><button class="primary big" style="width:100%">כניסה</button></div>
      <p class="muted small" style="text-align:center">שכחת סיסמה? פנה למורה.</p>` : `
      <label>קוד כיתה (מהמורה)</label><input id="c" type="text" class="ltr" value="${esc(code)}" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:3px">
      <label>שם מלא</label><input id="n" type="text" maxlength="60" placeholder="שם פרטי ושם משפחה">
      <label>שם משתמש (באנגלית)</label><input id="u" type="text" class="ltr" autocomplete="username" autocapitalize="none" placeholder="dana.cohen">
      <label>סיסמה (4 תווים לפחות)</label><input id="p" type="password" class="ltr" autocomplete="new-password">
      <div style="margin-top:16px"><button class="primary big" style="width:100%">הרשמה</button></div>`;
    $("#af").onsubmit = async e => {
      e.preventDefault(); $("#ae").textContent = "";
      const btn = $("#af button.primary"); btn.disabled = true;
      const r = m==="login"
        ? await sb.rpc("hw_student_login",{ p_username:$("#u").value, p_password:$("#p").value })
        : await sb.rpc("hw_student_register",{ p_join_code:$("#c").value, p_name:$("#n").value, p_username:$("#u").value, p_password:$("#p").value });
      btn.disabled = false;
      if(r.error){ $("#ae").textContent = errMsg(r.error); return; }
      store("hw-token", r.data.token); go("#/");
    };
  };
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => draw(b.dataset.m));
  draw(mode);
}
async function studentHome(){
  if(!store("hw-token")) return studentAuth("login");
  app().innerHTML = `<p class="muted">טוען…</p>`;
  let d; try{ d = await rpcS("hw_student_home", {}); }catch(e){ if(store("hw-token")) app().innerHTML = `<p class="err">${esc(errMsg(e))}</p>`; return; }
  const graded = d.assignments.filter(a => a.last && a.last.score != null);
  const avg = graded.length ? Math.round(graded.reduce((s,a)=>s+pct(a.last.score,a.last.max),0)/graded.length) : null;
  const todo = d.assignments.filter(a => !a.attempts && a.is_open && !isPast(a.due_at));
  const row = a => {
    let badge, grade = "", off = false;
    if(a.attempts){
      if(a.last && a.last.score != null) grade = `<div class="grade">${pct(a.last.score,a.last.max)}</div>`;
      else badge = `<span class="pill open">הוגש</span>`;
      if(a.is_open && !isPast(a.due_at) && (a.max_attempts==null || a.attempts < a.max_attempts)) badge = (badge||"") + ` <span class="pill">אפשר לשפר</span>`;
    } else if(isPast(a.due_at) || !a.is_open){ badge = `<span class="pill late">לא הוגש</span>`; off = true; }
    else badge = `<span class="pill todo">לביצוע</span>`;
    return `<div class="acard ${off?"off":""}" data-id="${a.id}" data-off="${off}">
      <div class="grow"><div style="font-weight:700">${esc(a.title)}</div>
      <div class="muted small">${a.questions} שאלות${a.due_at?` · עד ${fmtDate(a.due_at)}`:""}${a.attempts?` · הוגש ${fmtDate(a.last?.at)}`:""}</div></div>
      ${badge||""}${grade}</div>`;
  };
  app().innerHTML = `
    <h1>שלום ${esc(d.name)}</h1>
    <p class="muted" style="margin-top:0">כיתה ${esc(d.class)}</p>
    <div class="row">
      <div class="card stat"><div class="muted small">לביצוע</div><div class="score">${todo.length}</div></div>
      <div class="card stat"><div class="muted small">הוגשו</div><div class="score">${d.assignments.filter(a=>a.attempts).length}</div></div>
      <div class="card stat"><div class="muted small">ממוצע</div><div class="score">${avg ?? "–"}</div></div>
    </div>
    <div class="card">
      <h2>המשימות שלי</h2>
      ${d.assignments.length ? d.assignments.map(row).join("") : `<p class="muted">עדיין אין משימות לכיתה שלך.</p>`}
    </div>`;
  document.querySelectorAll(".acard").forEach(el => { if(el.dataset.off!=="true") el.onclick = () => go("#/s/"+el.dataset.id); });
}
async function studentAssignment(id){
  if(!store("hw-token")) return studentAuth("login");
  app().innerHTML = `<p class="muted">טוען…</p>`;
  let a; try{ a = await rpcS("hw_student_assignment", { p_id:id }); }catch(e){ if(store("hw-token")) app().innerHTML = `<div class="card"><h2>${esc(errMsg(e))}</h2><button onclick="go('#/')">חזרה</button></div>`; return; }
  const canSubmit = a.is_open && !isPast(a.due_at) && (a.max_attempts==null || a.attempts < a.max_attempts);
  const left = a.max_attempts==null ? "" : ` · נותרו ${Math.max(0,a.max_attempts-a.attempts)} ניסיונות`;
  app().innerHTML = `
    <button class="link" onclick="go('#/')">→ המשימות שלי</button>
    <h1>${esc(a.title)}</h1>
    <div class="row">${a.due_at?`<span class="pill ${isPast(a.due_at)?"late":""}">להגשה עד ${fmtDate(a.due_at)}</span>`:""}<span class="pill">${a.questions.length} שאלות</span></div>
    ${a.description ? `<p class="prompt">${esc(a.description)}</p>` : ""}
    <div id="body"></div>`;
  const body = $("#body");
  if(a.last){
    showReview(body, a, a.last);
    if(canSubmit){
      const b = document.createElement("div");
      b.innerHTML = `<p class="muted small">אפשר להגיש שוב${left}. הציון האחרון הוא הקובע.</p><button class="primary">ניסיון נוסף</button>`;
      b.querySelector("button").onclick = () => showForm(body, a);
      body.prepend(b);
    }
  } else if(canSubmit) showForm(body, a);
  else body.innerHTML = `<div class="card"><p class="muted">המשימה סגורה להגשה.</p></div>`;
}
function showForm(body, a){
  const dkey = "hw-draft-"+a.id;
  const draft = store(dkey) || {};
  body.innerHTML = `
    <div class="card" id="qs">
      ${a.questions.map((q,i)=>`
        <div class="q" data-id="${q.id}">
          <div><span class="qn">${i+1}.</span><span class="prompt">${esc(q.prompt)}</span>${q.points!=1?`<span class="muted small"> (${q.points} נק׳)</span>`:""}</div>
          ${answerInput(q, draft[q.id] ?? "")}
        </div>`).join("")}
    </div>
    <div class="row"><button class="primary big" id="sub">הגשה</button></div>
    <div id="out"></div>`;
  math(body);
  const save = () => store(dkey, collect());
  body.oninput = save;
  body.onchange = e => { save(); if(e.target.type==="radio") e.target.closest(".q").querySelectorAll(".choice").forEach(c=>c.classList.toggle("sel", c.contains(e.target))); };
  let warned = false;
  $("#sub").onclick = async () => {
    const answers = collect();
    const empty = a.questions.filter(q => !answers[q.id]).length;
    if(empty && !warned){ warned = true; $("#out").innerHTML = `<p class="err">יש ${empty} שאלות בלי תשובה. לחצו שוב על "הגשה" כדי להגיש בכל זאת.</p>`; return; }
    $("#sub").disabled = true; $("#sub").textContent = "שולח…";
    let r; try{ r = await rpcS("hw_student_submit", { p_id:a.id, p_answers:answers }); }
    catch(e){ $("#sub").disabled=false; $("#sub").textContent="הגשה"; $("#out").innerHTML=`<p class="err">${esc(errMsg(e))}</p>`; return; }
    store(dkey, null);
    a.attempts = r.attempt;
    showReview(body, a, { score:r.score, max:r.max, results:r.results, answers, at:new Date().toISOString() }, true);
  };
}
function showReview(body, a, last, fresh){
  const res = {}; (last.results||[]).forEach(x => res[x.question_id] = x);
  const graded = last.score != null;
  body.innerHTML = `
    ${fresh ? `<div class="card" style="text-align:center;border-color:var(--ok)"><b style="color:var(--ok)">ההגשה התקבלה ✓</b></div>` : ""}
    ${graded ? `<div class="card" style="text-align:center"><div class="muted">הציון שלך</div><div class="score">${pct(last.score,last.max)}</div><div class="muted">${last.score} מתוך ${last.max} נקודות · הוגש ${fmtDate(last.at)}</div></div>`
             : `<div class="card"><p class="muted" style="margin:0">הוגש ${fmtDate(last.at)}. הציון יוצג כשהמורה יפרסם אותו.</p></div>`}
    <div class="card">
      ${a.questions.map((q,i)=>{ const x = res[q.id] || {}; const given = (last.answers||{})[q.id] ?? x.given ?? "";
        const shown = q.kind==="choice" && given!=="" ? (q.choices||[])[+given] ?? given : given;
        let fb = "";
        if(x.correct === true) fb = `<div class="res ok">✓ נכון</div>`;
        else if(x.correct === false) fb = `<div class="res bad">✗ לא נכון${x.answer!=null?`. התשובה הנכונה: <bdi class="ltr">${esc(x.answer)}</bdi>`:""}</div>`;
        return `<div class="q"><div><span class="qn">${i+1}.</span><span class="prompt">${esc(q.prompt)}</span></div>
          <div class="muted small" style="margin-top:6px">התשובה שלך: <bdi class="ltr" style="color:var(--ink)">${given===""?"—":esc(shown)}</bdi> ${q.unit&&given!==""&&q.kind==="number"?`<bdi class="unit">${esc(q.unit)}</bdi>`:""}</div>${fb}</div>`; }).join("")}
    </div>
    ${fresh ? `<button onclick="go('#/')">חזרה למשימות</button>` : ""}`;
  math(body);
  if(fresh) window.scrollTo({top:0,behavior:"smooth"});
}
function answerInput(q, val){
  if(q.kind === "choice"){
    return `<div style="margin-top:8px">${(q.choices||[]).map((c,j)=>`
      <label class="choice ${String(val)===String(j)?"sel":""}"><input type="radio" name="q_${q.id}" value="${j}" ${String(val)===String(j)?"checked":""}>
      <span class="prompt" style="color:var(--ink)">${esc(c)}</span></label>`).join("")}</div>`;
  }
  const im = q.kind === "number" ? `inputmode="decimal"` : "";
  return `<div class="ansrow"><input type="text" class="ltr ans" ${im} autocomplete="off" value="${esc(val)}" placeholder="${q.kind==="number"?"מספר, למשל 2.5 או 3/4 או 1.2e-3":"תשובה"}">
    ${q.unit?`<span class="unit">${esc(q.unit)}</span>`:""}</div>`;
}
function collect(){
  const out = {};
  document.querySelectorAll("#qs .q").forEach(el => {
    const id = el.dataset.id, t = el.querySelector("input.ans"), r = el.querySelector("input[type=radio]:checked");
    const v = t ? t.value.trim() : (r ? r.value : "");
    if(v !== "") out[id] = v;
  });
  return out;
}

function downloadCsv(name, rows){

}

/* results */
async function tabResults(){
  const el = $("#tab"); el.innerHTML = `<p class="muted">טוען…</p>`;
  const [{ data:subs, error }, { data:students }] = await Promise.all([
    sb.from("hw_submissions").select("*").eq("assignment_id",A.id).order("created_at"),
    ACL.length ? sb.from("hw_students").select("id,display_name,class_id").in("class_id",ACL).order("display_name") : Promise.resolve({data:[]})
  ]);
  if(error){ el.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  const by = {}; subs.forEach(s => { const k = s.student_id || ("n:"+s.student_name.trim().toLowerCase()); (by[k] ||= []).push(s); });
  const cname = Object.fromEntries(CL.map(c=>[c.id,c.name]));
  const rows = (students||[]).map(st => ({ name:st.display_name, cls:cname[st.class_id], key:st.id, subs: by[st.id]||[] }));
  Object.keys(by).forEach(k => { if(!rows.find(r=>r.key===k)) rows.push({ name:by[k][0].student_name, cls:"", key:k, subs:by[k] }); });
  const done = rows.filter(r=>r.subs.length);
  if(!rows.length){ el.innerHTML = `<div class="card"><p class="muted">${ACL.length?"עדיין אין תלמידים רשומים בכיתות של המשימה.":"המשימה לא משויכת לכיתה."}</p></div>`; return; }
  const lastOf = r => r.subs[r.subs.length-1];
  const avg = done.length ? Math.round(done.reduce((s,r)=>s+pct(lastOf(r).score,lastOf(r).max_score),0)/done.length) : "–";
  const qstat = Q.map(q => { let ok=0,t=0; done.forEach(r=>{ const x=(lastOf(r).results||[]).find(z=>z.question_id===q.id); if(x){t++; if(x.correct) ok++;} }); return { q, pct: t? Math.round(100*ok/t):0, t }; });
  const hard = qstat.filter(s=>s.t).sort((a,b)=>a.pct-b.pct).slice(0,3);
  const multi = ACL.length > 1;
  el.innerHTML = `
    <div class="row" style="margin-top:14px">
      <div class="card stat"><div class="muted small">הגישו</div><div class="score">${done.length}<span class="muted" style="font-size:16px"> מתוך ${rows.length}</span></div></div>
      <div class="card stat"><div class="muted small">ממוצע</div><div class="score">${avg}</div></div>
    </div>
    ${hard.length?`<div class="card"><h2>השאלות שהכי קשות לכיתה</h2>${hard.map(s=>`
      <div class="row" style="margin:8px 0"><span class="qn">${Q.indexOf(s.q)+1}.</span><span class="grow prompt small">${esc(s.q.prompt)}</span>
      <div class="bar" style="width:90px"><i style="width:${s.pct}%"></i></div><span class="small">${s.pct}%</span></div>`).join("")}</div>`:""}
    <div class="card">
      <div class="row"><h2 class="grow" style="margin:0">ציונים</h2>${done.length?`<button id="csv">הורדה לאקסל</button>`:""}</div>
      <div class="tw"><table>
        <thead><tr><th>שם</th>${multi?"<th>כיתה</th>":""}<th>ציון</th>${Q.map((q,i)=>`<th class="c">${i+1}</th>`).join("")}<th>הוגש</th><th></th></tr></thead>
        <tbody>${rows.map(r=>{ if(!r.subs.length) return `<tr><td>${esc(r.name)}</td>${multi?`<td>${esc(r.cls)}</td>`:""}<td class="muted">לא הגיש</td>${Q.map(()=>`<td></td>`).join("")}<td></td><td></td></tr>`;
          const s=lastOf(r);
          return `<tr><td>${esc(r.name)}${r.subs.length>1?` <span class="muted small">(${r.subs.length} ניסיונות)</span>`:""}</td>${multi?`<td>${esc(r.cls)}</td>`:""}<td><b>${pct(s.score,s.max_score)}</b></td>
          ${Q.map(q=>{ const x=(s.results||[]).find(z=>z.question_id===q.id); return `<td class="c" title="${esc(x?.given??"")}">${!x?"–":x.correct?'<span class="yes">✓</span>':'<span class="no">✗</span>'}</td>`; }).join("")}
          <td class="muted">${fmtDate(s.created_at)}</td><td><button class="link danger" data-del="${esc(r.key)}">איפוס</button></td></tr>`; }).join("")}</tbody>
      </table></div>
      <p class="muted small">"איפוס" מוחק את ההגשות של התלמיד במשימה הזו כדי שיוכל להגיש מחדש. ריחוף על ✓/✗ מציג מה התלמיד כתב.</p>
    </div>`;
  math(el);
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const r = rows.find(x=>x.key===b.dataset.del); if(!confirm(`למחוק את ההגשות של ${r.name} במשימה הזו?`)) return;
    const { error } = await sb.from("hw_submissions").delete().in("id", r.subs.map(s=>s.id));
    if(error) return toast(error.message); toast("נמחק"); tabResults();
  });
  const csvBtn = $("#csv");
  if(csvBtn) csvBtn.onclick = () => {
    const head = ["שם","כיתה","ציון", ...Q.map((q,i)=>"שאלה "+(i+1)), "הוגש"];
    const lines = rows.map(r => { if(!r.subs.length) return [r.name, r.cls, "לא הגיש"]; const s=lastOf(r); return [r.name, r.cls, pct(s.score,s.max_score),
      ...Q.map(q=>{ const x=(s.results||[]).find(z=>z.question_id===q.id); return x? (x.correct?"נכון":"שגוי")+" ("+(x.given??"")+")" : ""; }), new Date(s.created_at).toLocaleString("he-IL")]; });
    downloadCsv(A.title, [head, ...lines]);
  };
}

החזר רק JSON תקין, בלי שום טקסט לפני או אחרי, בפורמט:
[
 {"prompt":"נוסח השאלה, נוסחאות בין סימני $ למשל $v=\\\\frac{d}{t}$", "kind":"number", "answer":{"value":12, "tol_pct":2, "unit":"m/s"}, "points":1},
 {"prompt":"...", "kind":"choice", "choices":["...","...","...","..."], "answer":{"index":1}},
 {"prompt":"...", "kind":"text", "answer":{"accepted":["2x+3","3+2x"]}}
]
kind: number לתשובה מספרית (value מספר בלבד, unit יחידות), choice לאמריקאית (index מתחיל מ-0), text לביטוי קצר (כל הצורות המקובלות ב-accepted).
שאלה מסוג "הסבר" או "הוכח" – הפוך לשאלה עם תשובה סופית או השמט.`;
function tabQuestions(){
  const el = $("#tab");
  el.innerHTML = `
    <div class="row" style="margin-top:14px">
      <button id="add">+ שאלה</button><button id="imp">ייבוא עם AI</button>
      <div class="grow"></div><button class="primary" id="save" disabled>שמירה</button>
    </div>
    <div id="impbox" class="card" style="display:none">
      <h2>ייבוא שאלות</h2>
      <p class="muted small">1. העתיקו את ההנחיה והדביקו אותה ב-Gemini או ב-Claude, יחד עם צילום הדף או הנושא.<br>2. העתיקו את מה שהוא מחזיר והדביקו בתיבה למטה.<br>3. בדקו את התשובות הנכונות בעורך ולחצו "שמירה".</p>
      <button id="cpp" style="margin-bottom:10px">📋 העתקת ההנחיה ל-AI</button>
      <textarea id="impt" class="ltr" style="min-height:160px" placeholder='[{"prompt":"...","kind":"number","answer":{"value":9.8,"tol_pct":1,"unit":"m/s^2"}}]'></textarea>
      <div class="row" style="margin-top:10px"><button class="primary" id="impgo">הוספה לשאלות</button><label class="chk small"><input type="checkbox" id="imprep"> להחליף את השאלות הקיימות</label></div>
      <p class="err" id="impe"></p>
    </div>
    <div id="qlist"></div>`;
  const markDirty = () => { dirty = true; $("#save").disabled = false; };
  const draw = () => {
    $("#qlist").innerHTML = Q.length ? Q.map((q,i)=>qEditor(q,i)).join("") : `<div class="card"><p class="muted">אין עדיין שאלות. הוסיפו שאלה או ייבאו.</p></div>`;
    Q.forEach((q,i)=>{ math($(`#pv${i}`)); });
  };
  draw();
  $("#add").onclick = () => { Q.push({ id:uuid(), assignment_id:A.id, prompt:"", kind:"number", choices:null, answer:{value:0,tol_pct:1,unit:""}, points:1, _new:true }); draw(); markDirty(); };
  $("#imp").onclick = () => { const b=$("#impbox"); b.style.display = b.style.display==="none"?"block":"none"; };
  $("#cpp").onclick = async () => { try{ await navigator.clipboard.writeText(AI_PROMPT); toast("ההנחיה הועתקה"); }catch(e){ $("#impt").value = AI_PROMPT; toast("ההנחיה בתיבה – העתיקו אותה ידנית"); } };
  $("#impgo").onclick = () => {
    try{
      let txt = $("#impt").value.trim();
      const s = txt.indexOf("["), e2 = txt.lastIndexOf("]");
      if(s >= 0 && e2 > s) txt = txt.slice(s, e2+1);
      let arr = JSON.parse(txt); if(!Array.isArray(arr)) arr = arr.questions;
      if(!Array.isArray(arr) || !arr.length) throw new Error("לא נמצאו שאלות");
      const norm = arr.map(x => normalizeQ(x));
      if($("#imprep").checked){ Q.forEach(q=>{ if(!q._new) removed.push(q.id); }); Q = []; }
      Q.push(...norm); $("#impt").value=""; $("#impbox").style.display="none"; draw(); markDirty(); toast(`נוספו ${norm.length} שאלות. לא לשכוח לשמור`);
    }catch(e){ $("#impe").textContent = "הקוד לא תקין: " + e.message; }
  };
  $("#qlist").addEventListener("input", e => {
    const box = e.target.closest(".qedit"); if(!box) return;
    const i = +box.dataset.i, q = Q[i], f = e.target.dataset.f;
    if(!f) return;
    if(f==="prompt"){ q.prompt = e.target.value; const pv=$(`#pv${i}`); pv.textContent=q.prompt; math(pv); }
    else if(f==="points") q.points = parseFloat(e.target.value)||0;
    else if(f==="value") q.answer.value = e.target.value;
    else if(f==="tol_pct") q.answer.tol_pct = parseFloat(e.target.value)||0;
    else if(f==="unit") q.answer.unit = e.target.value;
    else if(f==="accepted") q.answer.accepted = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean);
    else if(f==="choices") q.choices = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean);
    markDirty();
  });
  $("#qlist").addEventListener("change", e => {
    const box = e.target.closest(".qedit"); if(!box) return;
    const i = +box.dataset.i, q = Q[i], f = e.target.dataset.f;
    if(f==="kind"){
      q.kind = e.target.value;
      q.answer = q.kind==="number" ? {value:0,tol_pct:1,unit:""} : q.kind==="choice" ? {index:0} : {accepted:[]};
      q.choices = q.kind==="choice" ? (q.choices||["",""]) : null;
      draw(); markDirty();
    }
    if(f==="correct"){ q.answer.index = +e.target.value; markDirty(); }
    if(f==="choices"){ if(q.answer.index >= (q.choices||[]).length) q.answer.index = 0; draw(); }
  });
  $("#qlist").addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const i = +b.closest(".qedit").dataset.i, act = b.dataset.act;
    if(act==="del"){ const [q]=Q.splice(i,1); if(!q._new) removed.push(q.id); }
    if(act==="up" && i>0) [Q[i-1],Q[i]]=[Q[i],Q[i-1]];
    if(act==="down" && i<Q.length-1) [Q[i+1],Q[i]]=[Q[i],Q[i+1]];
    draw(); markDirty();
  });
  $("#save").onclick = async () => {
    const bad = Q.findIndex(q => !q.prompt.trim() || (q.kind==="number" && (q.answer.value===""||isNaN(Number(q.answer.value)))) || (q.kind==="choice" && (q.choices||[]).length<2) || (q.kind==="text" && !(q.answer.accepted||[]).length));
    if(bad>=0){ toast(`שאלה ${bad+1} לא שלמה`); return; }
    $("#save").disabled = true; $("#save").textContent = "שומר…";
    try{
      if(removed.length){ const { error } = await sb.from("hw_questions").delete().in("id", removed); if(error) throw error; }
      const rows = Q.map((q,i)=>({ id:q.id, assignment_id:A.id, position:i+1, prompt:q.prompt, kind:q.kind, choices:q.kind==="choice"?q.choices:null,
        answer: q.kind==="number" ? { value:Number(q.answer.value), tol_pct:Number(q.answer.tol_pct??1), unit:q.answer.unit||"" } : q.answer, points:q.points }));
      if(rows.length){ const { error } = await sb.from("hw_questions").upsert(rows); if(error) throw error; }
      Q.forEach(q=>delete q._new); removed = []; dirty = false; toast("נשמר ✓");
      $("#save").textContent = "שמירה";
    }catch(e){ toast("שגיאה: "+e.message); $("#save").disabled=false; $("#save").textContent="שמירה"; }
  };
}
function normalizeQ(x){
  const kind = ["number","choice","text"].includes(x.kind) ? x.kind : (x.choices ? "choice" : "number");
  let answer = x.answer ?? {};
  if(kind==="number"){
    if(typeof answer !== "object") answer = { value: answer };
    answer = { value: Number(answer.value), tol_pct: answer.tol_pct ?? 1, unit: answer.unit ?? x.unit ?? "" };
    if(isNaN(answer.value)) throw new Error("ערך מספרי חסר בשאלה: "+(x.prompt||"").slice(0,30));
  } else if(kind==="choice"){
    if(typeof answer !== "object") answer = { index: answer };
    answer = { index: Number(answer.index ?? 0) };
  } else {
    if(typeof answer === "string") answer = { accepted:[answer] };
    answer = { accepted: (answer.accepted||[]).map(String) };
  }
  return { id:uuid(), assignment_id:A.id, prompt:String(x.prompt||""), kind, choices: kind==="choice" ? (x.choices||[]).map(String) : null, answer, points: Number(x.points ?? 1), _new:true };
}
function qEditor(q,i){
  const k = q.kind;
  let ans = "";
  if(k==="number") ans = `<div class="row">
      <div class="grow"><label>תשובה נכונה</label><input type="text" class="ltr" data-f="value" value="${esc(q.answer.value)}"></div>
      <div style="width:110px"><label>סטייה מותרת %</label><input type="number" min="0" step="0.1" class="ltr" data-f="tol_pct" value="${esc(q.answer.tol_pct ?? 1)}"></div>
      <div style="width:110px"><label>יחידות</label><input type="text" class="ltr" data-f="unit" value="${esc(q.answer.unit||"")}"></div></div>`;
  else if(k==="choice") ans = `<label>אפשרויות (שורה לכל אפשרות)</label><textarea data-f="choices" style="min-height:70px">${esc((q.choices||[]).join("\n"))}</textarea>
      <label>התשובה הנכונה</label><select data-f="correct">${(q.choices||[]).map((c,j)=>`<option value="${j}" ${q.answer.index===j?"selected":""}>${j+1}. ${esc(c.slice(0,50))}</option>`).join("")}</select>`;
  else ans = `<label>תשובות מתקבלות (שורה לכל תשובה; לא רגיש לרווחים ולאותיות גדולות)</label><textarea data-f="accepted" class="ltr" style="min-height:60px">${esc((q.answer.accepted||[]).join("\n"))}</textarea>`;
  return `<div class="qedit" data-i="${i}">
    <div class="row"><span class="qn">${i+1}.</span>
      <select data-f="kind" style="width:auto"><option value="number" ${k==="number"?"selected":""}>תשובה מספרית</option><option value="choice" ${k==="choice"?"selected":""}>בחירה מרובה</option><option value="text" ${k==="text"?"selected":""}>ביטוי / מילה</option></select>
      <span class="muted small">נק׳</span><input type="number" min="0" step="0.5" data-f="points" value="${esc(q.points)}" style="width:70px">
      <div class="grow"></div><button class="link" data-act="up" title="למעלה">▲</button><button class="link" data-act="down" title="למטה">▼</button><button class="link danger" data-act="del">מחיקה</button></div>
    <label>השאלה (נוסחאות בין סימני $, למשל $v=\\frac{d}{t}$)</label>
    <textarea data-f="prompt">${esc(q.prompt)}</textarea>
    <div class="preview" id="pv${i}">${esc(q.prompt)}</div>
    ${ans}
  </div>`;
}

/* settings */
function tabSettings(){
  const el = $("#tab");
  const local = A.due_at ? new Date(new Date(A.due_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
  el.innerHTML = `<div class="card">
    <label>שם המשימה</label><input id="s_title" type="text" value="${esc(A.title)}">
    <label>כיתות</label>
    ${CL.length ? CL.map(c=>`<label class="chk"><input type="checkbox" class="s_cls" value="${c.id}" ${ACL.includes(c.id)?"checked":""}> ${esc(c.name)}</label>`).join("") : `<p class="muted small">אין עדיין כיתות. צרו כיתה במסך הראשי ← "כיתות".</p>`}
    <label>הוראות לתלמידים (לא חובה)</label><textarea id="s_desc">${esc(A.description||"")}</textarea>
    <div class="row">
      <div class="grow"><label>מועד אחרון להגשה (לא חובה)</label><input id="s_due" type="datetime-local" value="${local}"></div>
      <div class="grow"><label>מספר ניסיונות לכל תלמיד</label><select id="s_att">
        ${[1,2,3,5].map(n=>`<option value="${n}" ${A.max_attempts===n?"selected":""}>${n}</option>`).join("")}<option value="" ${A.max_attempts==null?"selected":""}>ללא הגבלה</option></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="s_open" ${A.is_open?"checked":""}> המשימה פתוחה (התלמידים רואים אותה)</label>
    <label class="chk"><input type="checkbox" id="s_show" ${A.show_results?"checked":""}> להראות לתלמיד ציון ותשובות נכונות אחרי ההגשה</label>
    <p class="muted small">אם תכבו את האפשרות האחרונה, התלמידים יראו רק "הוגש". אפשר להדליק אותה מאוחר יותר, למשל אחרי המועד האחרון, והציונים יופיעו להם.</p>
    <div class="row" style="margin-top:16px"><button class="primary" id="s_save">שמירה</button><div class="grow"></div><button class="danger" id="s_del">מחיקת המשימה</button></div>
  </div>`;
  $("#s_save").onclick = async () => {
    const due = $("#s_due").value;
    const upd = { title:$("#s_title").value.trim()||"ללא שם", description:$("#s_desc").value, due_at: due? new Date(due).toISOString(): null,
      max_attempts: $("#s_att").value? +$("#s_att").value : null, is_open:$("#s_open").checked, show_results:$("#s_show").checked };
    const { error } = await sb.from("hw_assignments").update(upd).eq("id",A.id);
    if(error) return toast(error.message);
    const want = [...document.querySelectorAll(".s_cls:checked")].map(x=>x.value);
    const add = want.filter(x=>!ACL.includes(x)), del = ACL.filter(x=>!want.includes(x));
    if(add.length){ const r = await sb.from("hw_assignment_classes").insert(add.map(c=>({ assignment_id:A.id, class_id:c }))); if(r.error) return toast(r.error.message); }
    if(del.length){ const r = await sb.from("hw_assignment_classes").delete().eq("assignment_id",A.id).in("class_id",del); if(r.error) return toast(r.error.message); }
    ACL = want; Object.assign(A, upd); $("#ttl").textContent = A.title; drawAssignHeader(); toast("נשמר ✓");
  };
  $("#s_del").onclick = async () => {
    if(!confirm("למחוק את המשימה, כל השאלות וכל ההגשות? אי אפשר לבטל.")) return;
    const { error } = await sb.from("hw_assignments").delete().eq("id",A.id);
    if(error) return toast(error.message); go("#/teacher");
  };
}

/* ---------- boot ---------- */
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("load", async () => {
  if(!window.supabase){ app().innerHTML = `<p class="err">שגיאה בטעינה. נסו לרענן.</p>`; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { session = s; });
  route();
});
</script>
